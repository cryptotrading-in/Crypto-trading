name: One-time CryptoTrade session and round display fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply targeted fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('worker.js'); s=p.read_text()
          replacements=[
            ("const setCookie=(sid,max)=>`ct_session=${encodeURIComponent(sid)}; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=${max}; Priority=High`;\nconst clearCookie='ct_session=; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=0';", "const setCookie=(sid,max,name='ct_session')=>`${name}=${encodeURIComponent(sid)}; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=${max}; Priority=High`;\nconst clearCookie=(name='ct_session')=>`${name}=; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=0`;\nconst cookieValue=(r,name)=>r.headers.get('Cookie')?.match(new RegExp('(?:^|;\\s*)'+name.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'=([^;]+)'))?.[1]||null;"),
            ("async function sess(r,e){const v=r.headers.get('Cookie')?.match(/ct_session=([^;]+)/)?.[1];if(!v)return null;const s=await e.DB.prepare('SELECT * FROM sessions WHERE id=? AND expires_at>?').bind(decodeURIComponent(v),now()).first();if(s)await e.DB.prepare('UPDATE sessions SET expires_at=? WHERE id=?').bind(new Date(Date.now()+2592000000).toISOString(),s.id).run();return s}", "async function sess(r,e,primary='ct_session',legacy=''){for(const name of [primary,legacy].filter(Boolean)){const v=cookieValue(r,name);if(!v)continue;const s=await e.DB.prepare('SELECT * FROM sessions WHERE id=? AND expires_at>?').bind(decodeURIComponent(v),now()).first();if(s){await e.DB.prepare('UPDATE sessions SET expires_at=? WHERE id=?').bind(new Date(Date.now()+2592000000).toISOString(),s.id).run();return s}}return null}"),
            ("async function client(r,e){const s=await sess(r,e);if(!s?.user_id)throw Error('AUTH_REQUIRED');return s}\nasync function admin(r,e){const s=await sess(r,e);if(!s?.admin_id)throw Error('ADMIN_REQUIRED');return s}", "async function client(r,e){const s=await sess(r,e,'ct_client_session','ct_session');if(!s?.user_id)throw Error('AUTH_REQUIRED');return s}\nasync function admin(r,e){const s=await sess(r,e,'ct_admin_session','ct_session');if(!s?.admin_id)throw Error('ADMIN_REQUIRED');return s}"),
            ("return ok({user:{id:uid,email,fullName:b.fullName,referralCode:rc}},{'Set-Cookie':setCookie(sid,2592000)})", "return ok({user:{id:uid,email,fullName:b.fullName,referralCode:rc}},{'Set-Cookie':setCookie(sid,2592000,'ct_client_session')})"),
            ("return ok({user:{id:u.id,email:u.email,fullName:u.full_name}},{'Set-Cookie':setCookie(sid,2592000)})", "return ok({user:{id:u.id,email:u.email,fullName:u.full_name}},{'Set-Cookie':setCookie(sid,2592000,'ct_client_session')})"),
            ("return ok({admin:{id:a.id,username:a.username,email:a.email,role:a.role}},{'Set-Cookie':setCookie(sid,2592000)})", "return ok({admin:{id:a.id,username:a.username,email:a.email,role:a.role}},{'Set-Cookie':setCookie(sid,2592000,'ct_admin_session')})"),
            ("async function logout(r,e){const s=await sess(r,e);if(s)await e.DB.prepare('DELETE FROM sessions WHERE id=?').bind(s.id).run();return ok({}, {'Set-Cookie':clearCookie})}", "async function logout(r,e){const c=await sess(r,e,'ct_client_session','ct_session'),a=await sess(r,e,'ct_admin_session');const ids=[c?.id,a?.id].filter(Boolean);if(ids.length)for(const sid of [...new Set(ids)])await e.DB.prepare('DELETE FROM sessions WHERE id=?').bind(sid).run();return ok({}, {'Set-Cookie':clearCookie('ct_client_session')+'; '+clearCookie('ct_admin_session')+'; '+clearCookie('ct_session')})}"),
          ]
          for old,new in replacements:
              if old not in s: raise SystemExit('worker pattern not found: '+old[:90])
              s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('client.html'); s=p.read_text()
          old="const api=async(p,o={})=>{const r=await fetch('/api'+p,{...o,cache:'no-store',headers:{'content-type':'application/json',...(o.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok||d.ok===false)throw Error(d.error||'Request failed');return d};"
          new="const api=async(p,o={},attempt=0)=>{let r;try{r=await fetch('/api'+p,{...o,credentials:'include',cache:'no-store',headers:{'content-type':'application/json',...(o.headers||{})}})}catch(e){if(attempt<2){await new Promise(x=>setTimeout(x,350*(attempt+1)));return api(p,o,attempt+1)}throw e}let d={};try{d=await r.json()}catch{}if(!r.ok||d.ok===false){if(attempt<2&&r.status>=500){await new Promise(x=>setTimeout(x,350*(attempt+1)));return api(p,o,attempt+1)}const e=Error(d.error||'Request failed');e.status=r.status;throw e}return d};"
          if old not in s: raise SystemExit('client api pattern not found')
          s=s.replace(old,new,1)
          old="async function start(){try{state=await api('/me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');await renderHome()}catch(e){$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('msg').textContent='Please sign in to continue.'}}"
          new="async function start(){try{state=await api('/me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');await renderHome()}catch(e){if(e.status===401){$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('msg').textContent='Please sign in to continue.'}else{$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('msg').textContent='Connection issue. Retrying…';setTimeout(()=>start(),1200)}}}"
          if old not in s: raise SystemExit('client start pattern not found')
          s=s.replace(old,new,1)
          old="const t=new Date(r.start_at).getTime(),live=r.enabled&&Date.now()>=t&&Date.now()<=t+60000;"
          new="const t=new Date(r.start_at).getTime(),e=new Date(r.cycle_end).getTime(),n=Date.now(),live=r.enabled&&Number.isFinite(t)&&Number.isFinite(e)&&n>=t&&n<=e;"
          if old not in s: raise SystemExit('round timing pattern not found')
          s=s.replace(old,new,1)
          old="'Start: '+date(r.start_at)+' · Entry: '+(live?'OPEN NOW':'scheduled')"
          new="'Start: '+date(r.start_at)+' · Entry: '+(live?'OPEN NOW':Date.now()<new Date(r.start_at).getTime()?'SCHEDULED':'CLOSED')"
          if old not in s: raise SystemExit('round label pattern not found')
          s=s.replace(old,new,1); p.write_text(s)
          p=Path('admin.html'); s=p.read_text()
          old="const $=x=>document.getElementById(x);const api=async(path,opt={})=>{const r=await fetch('/api'+path,{...opt,headers:{'content-type':'application/json',...(opt.headers||{})}});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'Request failed');return d};"
          new="const $=x=>document.getElementById(x);const api=async(path,opt={},attempt=0)=>{let r;try{r=await fetch('/api'+path,{...opt,credentials:'include',headers:{'content-type':'application/json',...(opt.headers||{})}})}catch(e){if(attempt<2){await new Promise(x=>setTimeout(x,350*(attempt+1)));return api(path,opt,attempt+1)}throw e}let d={};try{d=await r.json()}catch{}if(!r.ok||d.ok===false){if(attempt<2&&r.status>=500){await new Promise(x=>setTimeout(x,350*(attempt+1)));return api(path,opt,attempt+1)}const e=Error(d.error||'Request failed');e.status=r.status;throw e}return d};"
          if old not in s: raise SystemExit('admin api pattern not found')
          s=s.replace(old,new,1)
          old="async function boot(){try{await api('/admin/me');$('status').textContent='';dashboard()}catch{login()}}"
          new="async function boot(){try{await api('/admin/me');$('status').textContent='';dashboard()}catch(e){if(e.status===401)login();else{login();$('status').textContent='Connection issue — retrying…';setTimeout(()=>boot(),1200)}}}"
          if old not in s: raise SystemExit('admin boot pattern not found')
          s=s.replace(old,new,1); p.write_text(s)
          PY
      - name: Commit targeted changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js client.html admin.html
          git diff --cached --check
          git commit -m "Fix round entry status and persistent client/admin sessions"
          git push
      - name: Remove one-time patch workflow
        if: success()
        run: |
          git rm .github/workflows/one-time-session-fix.yml
          git commit -m "Remove one-time session fix workflow"
          git push
