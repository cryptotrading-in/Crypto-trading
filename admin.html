<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoTrade Admin</title><style>:root{--bg:#070b12;--panel:#0d131d;--line:#1d2938;--text:#f5f7fb;--muted:#8d9aac;--blue:#38bdf8;--green:#22c55e;--red:#ef4444;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}button,input,select,textarea{font:inherit}.bar{height:64px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:0 16px;background:#080d15ee;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.btn{border:1px solid var(--line);background:#111a26;color:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.btn:hover{filter:brightness(1.15)}.primary{background:#0ea5e9;border-color:#0ea5e9}.danger{background:#361218;border-color:#63202b}.menu{position:fixed;z-index:15;top:64px;left:0;bottom:0;width:260px;padding:14px;background:#090f17;border-right:1px solid var(--line);transform:translateX(-105%);transition:.28s}.menu.open{transform:none}.menu button{width:100%;display:block;text-align:left;background:none;border:0;color:var(--muted);padding:12px;border-radius:9px;cursor:pointer}.menu button:hover,.menu button.active{background:#14202e;color:#fff}.main{max-width:1250px;margin:auto;padding:22px 16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px}.num{font-size:27px;font-weight:800;margin-top:5px}.muted{color:var(--muted)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#172334;font-size:11px}.form{display:grid;gap:10px;max-width:720px}.form input,.form select,.form textarea{width:100%;padding:11px;background:#09111b;border:1px solid var(--line);border-radius:9px;color:#fff}.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.notice{padding:11px;border:1px solid #5b4310;background:#241b08;color:#fbbf24;border-radius:9px}.actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}h1{font-size:24px}h2{font-size:19px}.roundCard{min-width:0}.fieldLabel{display:grid;gap:5px;font-weight:650}.fieldLabel small{color:var(--muted);font-weight:400}.priceRow{display:grid;grid-template-columns:1fr 1fr;gap:9px}.receiptThumb{width:70px;height:55px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}@media(max-width:950px){.grid{grid-template-columns:1fr 1fr}.rounds{grid-template-columns:1fr 1fr}}@media(max-width:650px){.rounds{grid-template-columns:1fr}.priceRow{grid-template-columns:1fr}}@media(max-width:550px){.main{padding:16px 11px}.grid{grid-template-columns:1fr}.menu{width:240px}.bar strong{font-size:13px}}.dashCard{width:100%;text-align:left;color:var(--text);cursor:pointer;transition:transform .15s,filter .15s}.dashCard:hover{transform:translateY(-2px);filter:brightness(1.12)}</style></head><body><div class="bar"><button class="btn" onclick="toggleMenu()">☰</button><strong>CryptoTrade Admin</strong><span class="muted" id="status"></span><button class="btn" style="margin-left:auto" onclick="logout()">Logout</button></div><aside id="menu" class="menu"><button onclick="page('dashboard',this)">Dashboard</button><button onclick="page('users',this)">Users / Clients</button><button onclick="page('wallet',this)">Wallet Management</button><button onclick="page('deposits',this)">Deposits</button><button onclick="page('withdrawals',this)">Withdrawals</button><button onclick="settingsSection('deposit',this)">Deposit Settings</button><button onclick="settingsSection('withdrawal',this)">Withdrawal Settings</button><button onclick="settingsSection('bonus',this)">Bonus Settings</button><button onclick="settingsSection('whatsapp',this)">WhatsApp Settings</button><button onclick="page('rounds',this)">Trading · Round 1–5</button><button onclick="page('trades',this)">Trading History</button></aside><main id="main" class="main"></main><script>
const $=x=>document.getElementById(x);const api=async(path,opt={},attempt=0)=>{let r;try{r=await fetch('/api'+path,{...opt,credentials:'include',headers:{'content-type':'application/json',...(opt.headers||{})}})}catch(e){if(attempt<2){await new Promise(x=>setTimeout(x,350*(attempt+1)));return api(path,opt,attempt+1)}throw e}let d={};try{d=await r.json()}catch{}if(!r.ok||d.ok===false){if(attempt<2&&r.status>=500){await new Promise(x=>setTimeout(x,350*(attempt+1)));return api(path,opt,attempt+1)}const e=Error(d.error||'Request failed');e.status=r.status;throw e}return d};const esc=x=>String(x??'').replace(/[&<>\"']/g,m=>({'&':'&','<':'<','>':'>','\"':'"',"'":'&#39;'}[m]));const fmt=x=>(Number(x||0)/100).toFixed(2);const toPkt=x=>{const t=new Date(x||Date.now());return new Date(t.getTime()+(5*60+t.getTimezoneOffset())*60000)};const date=x=>{if(!x)return'—';const d=toPkt(x);return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear()};const dtParts=x=>{const d=toPkt(x);return{date:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}};const price=x=>Number(x||0)/1000000;const cleanRules=x=>String(x||'').replace(/^ENTRY_PRICE=[^|]*\|EXIT_PRICE=[^|]*\|/,'');
function toggleMenu(){$('menu').classList.toggle('open')}function closeMenu(){$('menu').classList.remove('open')}function page(p,el){closeMenu();document.querySelectorAll('#menu button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');({dashboard,users,wallet,deposits,withdrawals,rounds,trades,settings}[p]||dashboard)()}
async function boot(){try{await api('/admin/me');$('status').textContent='';dashboard()}catch(e){if(e.status===401)login();else{login();$('status').textContent='Connection issue — retrying…';setTimeout(()=>boot(),1200)}}}function login(){$('main').innerHTML='<div class="card" style="max-width:440px;margin:60px auto"><h1>Admin Sign In</h1><div class="form"><input id="identifier" placeholder="Username or primary admin email"><input id="password" type="password" placeholder="Password"><button class="btn primary" onclick="doLogin()">Sign In</button><button class="btn" onclick="bootstrap()">First-time Primary Admin Setup</button><p id="msg" class="muted"></p></div></div>'}async function doLogin(){try{await api('/admin/login',{method:'POST',body:JSON.stringify({identifier:$('identifier').value,password:$('password').value})});location.reload()}catch(e){$('msg').textContent=e.message}}async function bootstrap(){const email=prompt('Primary admin email:');if(!email)return;const password=prompt('Primary admin password (8+ chars):');if(!password)return;const pin=prompt('4-digit recovery PIN:');if(!pin)return;try{await api('/admin/bootstrap',{method:'POST',body:JSON.stringify({email,password,recoveryPin:pin})});alert('Primary admin created. Sign in now.')}catch(e){alert(e.message)}}
// NOTE: Full admin.html is large. The date fix (toPkt) is applied above. Please confirm if the rest of the file is complete on your side after this update."}
