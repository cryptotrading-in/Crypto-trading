name: Direct client home source fix
on:
  push:
    branches: [fix/client-home-direct-source]
jobs:
  patch:
    if: github.actor == 'cryptotrading-in'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch client home source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('client.html')
          s=p.read_text()
          old='''async function renderHome(){const s=await refresh();$('main').innerHTML='<h1>Welcome, '+esc(s.user.full_name)+'</h1><div class="grid"><div class="card"><span class="muted">Available</span><div class="num">'+money(s.wallet.available)+' USDT</div></div><div class="card"><span class="muted">Withdrawal</span><div class="num">'+money(s.wallet.withdrawal)+' USDT</div></div><div class="card"><span class="muted">Account</span><div class="num">Active</div></div><div class="card"><span class="muted">Rounds</span><div class="num">5</div></div></div><h2>Trading Rounds</h2><div class="rounds">'+renderRounds(s)+'</div>'}'''
          new='''async function renderHome(){const s=await refresh();const w=s.wallet||{};$('main').innerHTML='<h1>Welcome, '+esc(s.user.full_name)+'</h1><div class="homeActions"><button type="button" class="card homeAction" onclick="page(\\'wallet\\')"><span class="muted">Balance</span><div class="num">'+money(w.available)+' USDT</div></button><button type="button" class="card homeAction" onclick="page(\\'deposit\\')"><span class="muted">Deposit</span><div class="num">Open</div></button><button type="button" class="card homeAction" onclick="page(\\'withdraw\\')"><span class="muted">Withdrawal</span><div class="num">'+money(w.withdrawal)+' USDT</div></button><button type="button" class="card homeAction" onclick="page(\\'trading\\')"><span class="muted">Rounds</span><div class="num">5</div></button></div>'}'''
          if old not in s:
              print('OLD_HOME_NOT_FOUND')
              raise SystemExit(2)
          s=s.replace(old,new,1)
          s=s.replace("$('balanceTop').textContent='Available '+money(state.wallet?.available)+' USDT'", "$('balanceTop').textContent='Account Active'", 1)
          marker='/* direct-home-fix */'
          s=s.replace('</style>', '.homeActions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.homeAction{width:100%;text-align:left;cursor:pointer;color:inherit}.homeAction:active{transform:scale(.99)}@media(max-width:520px){.homeActions{gap:10px}}/* direct-home-fix */</style>',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix client home directly in source'
          git push
