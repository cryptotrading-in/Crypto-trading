<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoTrade Admin</title><link rel="stylesheet" href="/glassmorphism.css"><style>:root{--primary:#0f0;--bg:#000;--card:#1a1a2e;--text:#fff;--muted:#999}body{margin:0;padding:0;font-family:sans-serif;background:#000;color:var(--text)}#menu{position:fixed;left:0;top:0;width:250px;height:100vh;background:#1a1a2e;padding:20px;overflow-y:auto;transform:translateX(-100%);transition:transform .3s;z-index:1000}#menu.open{transform:translateX(0)}#menu button{width:100%;text-align:left;margin:5px 0;padding:10px;border:none;border-radius:4px;background:#333;color:#fff;cursor:pointer}#menu button.active{background:var(--primary);color:#000}#main{padding:20px;max-width:1400px;margin:0 auto}.card{background:var(--card);border:1px solid #333;border-radius:8px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}.dashCard{text-align:center;cursor:pointer}.dashCard:hover{background:rgba(0,255,0,.1)}.num{font-size:2em;font-weight:bold;color:var(--primary)}.section{margin:20px 0}.muted{color:var(--muted);font-size:.9em}input,select{padding:8px;margin:5px 0;border:none;border-radius:4px;background:#333;color:#fff;width:100%;box-sizing:border-box}button{padding:10px 20px;margin:5px;border:none;border-radius:4px;background:#333;color:#fff;cursor:pointer;font-weight:bold}button.btn{background:#333}button.btn.primary{background:var(--primary);color:#000}button:hover{opacity:.8}table{width:100%;border-collapse:collapse}table th,table td{padding:10px;text-align:left;border-bottom:1px solid #333}table th{font-weight:bold;background:rgba(0,0,0,.3)}table tr:hover{background:rgba(255,255,255,.05)}.badge{display:inline-block;padding:4px 8px;border-radius:4px;font-size:.85em;font-weight:bold}.badge.green{background:rgba(34,197,94,.2);color:#22c55e}.badge.amber{background:rgba(217,119,6,.2);color:#f59e0b}.badge.red{background:rgba(220,38,38,.2);color:#ef4444}.form label{display:block;margin:10px 0;font-weight:bold}.notice{background:rgba(245,158,11,.1);border:1px solid #f59e0b;padding:10px;border-radius:4px;margin:10px 0}#status{color:var(--primary)}</style></head><body><div id="menu"><button class="active" onclick="dashboard()">Dashboard</button> <button onclick="users()">Clients</button> <button onclick="deposits()">Deposits</button> <button onclick="withdrawals()">Withdrawals</button> <button onclick="trades()">Trades</button> <button onclick="rounds()">Rounds</button> <button onclick="referrals()">🔗 Referrals</button> <button onclick="settings()">Settings</button> <button onclick="logout()" style="margin-top:30px">Logout</button></div><div style="display:flex;justify-content:space-between;align-items:center;padding:15px"><h1 style="margin:0">CryptoTrade Admin</h1><button class="btn" onclick="toggleMenu()">☰</button></div><div id="status" style="text-align:center;margin:10px"></div><div id="main"></div><script>const $=x=>document.getElementById(x);const api=async(path,opt={},attempt=0)=>{let r;try{r=await fetch('/api'+path,{...opt,credentials:'include',headers:{'content-type':'application/json',...(opt.headers||{})}});if(!r.ok)throw{status:r.status,text:await r.text()};return await r.json()}catch(e){if(attempt<2&&(!e.status||e.status===500))return new Promise(x=>setTimeout(()=>x(api(path,opt,attempt+1)),500+Math.random()*500));throw e}};const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>(Number(n||0)/100).toFixed(2);const price=n=>'$'+(Number(n||0)/1e6).toFixed(2);const dtParts=d=>{const date=new Date(d);return{date:date.toLocaleDateString(),time:date.toLocaleTimeString()}};function toggleMenu(){$('menu').classList.toggle('open')}function closeMenu(){$('menu').classList.remove('open')}function page(p,el){closeMenu();document.querySelectorAll('#menu button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active')}async function boot(){try{await api('/admin/me');$('status').textContent='';dashboard()}catch(e){if(e.status===401)login();else{login();$('status').textContent='Connection issue — retrying…';setTimeout(boot,5000)}}}function login(){$('menu').style.display='none';$('main').innerHTML='<div class="card" style="max-width:400px;margin:50px auto"><h1>Admin Login</h1><input id="adminUser" placeholder="Username or Email"><input id="adminPass" type="password" placeholder="Password"><button onclick="submitAdminLogin()" class="btn primary" style="width:100%">Login</button><div id="loginMsg" class="muted"></div></div>'}async function submitAdminLogin(){try{const d=await api('/admin/login',{method:'POST',body:JSON.stringify({identifier:$('adminUser').value,password:$('adminPass').value})});if(!d.ok)throw Error(d.error||'Login failed');$('menu').style.display='block';boot()}catch(e){$('loginMsg').textContent='Error: '+e.message}}async function dashboard(){try{const d=await api('/admin/summary');page('dashboard',null);$('main').innerHTML='<h1>Dashboard</h1><div class="grid"><button class="card dashCard" onclick="users()">Clients<div class="num">'+(d.summary?.clients||0)+'</div></button><button class="card dashCard" onclick="deposits()">Pending Deposits<div class="num">'+(d.summary?.pendingDeposits||0)+'</div></button><button class="card dashCard" onclick="withdrawals()">Pending Withdrawals<div class="num">'+(d.summary?.pendingWithdrawals||0)+'</div></button><button class="card dashCard" onclick="trades()">Trades<div class="num">'+(d.summary?.trades||0)+'</div></button></div>'}catch(e){$('main').innerHTML='<div class="card error">'+e.message+'</div>'}}async function users(){try{const d=await api('/admin/users');page('users',null);$('main').innerHTML='<div class="section"><h1>Users / Clients</h1><button class="btn" onclick="users()">Refresh</button></div><div class="card"><table><tr><th>Name</th><th>Email</th><th>Country</th><th>Status</th><th>Balance</th><th>Date</th></tr>'+(d.rows||[]).map(u=>'<tr><td>'+esc(u.full_name)+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.country||'-')+'</td><td>'+u.account_status+'</td><td>'+money(u.available_minor)+'</td><td>'+new Date(u.created_at).toLocaleDateString()+'</td></tr>').join('')+'</table></div>'}catch(e){$('main').innerHTML='<div class="card error">'+e.message+'</div>'}}async function deposits(){try{const d=await api('/admin/deposits');page('deposits',null);$('main').innerHTML='<div class="section"><h1>Deposits</h1><button class="btn" onclick="deposits()">Refresh</button></div><div class="card"><table><tr><th>User</th><th>Amount</th><th>Network</th><th>Status</th><th>Action</th></tr>'+(d.rows||[]).map(dep=>'<tr><td>'+esc(dep.user_email)+'</td><td>'+money(dep.amount_minor)+'</td><td>'+dep.network+'</td><td><span class="badge '+(dep.status==='approved'?'green':dep.status==='rejected'?'red':'amber')+'">'+dep.status+'</span></td><td>'+(dep.status==='pending'?'<button class="btn" onclick="reviewDeposit(\''+dep.id+'\',true)">✓</button><button class="btn" onclick="reviewDeposit(\''+dep.id+'\',false)">✗</button>':'-')+'</td></tr>').join('')+'</table></div>'}catch(e){$('main').innerHTML='<div class="card error">'+e.message+'</div>'}}async function reviewDeposit(id,approve){try{await api('/admin/deposit-review',{method:'POST',body:JSON.stringify({id,approved:approve})});deposits()}catch(e){alert('Error: '+e.message)}}async function withdrawals(){try{const d=await api('/admin/withdrawals');page('withdrawals',null);$('main').innerHTML='<div class="section"><h1>Withdrawals</h1><button class="btn" onclick="withdrawals()">Refresh</button></div><div class="card"><table><tr><th>User</th><th>Amount</th><th>Address</th><th>Status</th><th>Action</th></tr>'+(d.rows||[]).map(w=>'<tr><td>'+esc(w.user_email)+'</td><td>'+money(w.amount_minor)+'</td><td>'+esc(w.withdrawal_address.substring(0,15)+'...')+'</td><td><span class="badge '+(w.status==='completed'?'green':'amber')+'">'+w.status+'</span></td><td>'+(w.status==='pending'?'<button class="btn" onclick="updateWithdrawal(\''+w.id+'\',\'completed\')">Complete</button>':'-')+'</td></tr>').join('')+'</table></div>'}catch(e){$('main').innerHTML='<div class="card error">'+e.message+'</div>'}}async function updateWithdrawal(id,status){try{await api('/admin/withdrawal-status',{method:'POST',body:JSON.stringify({id,status})});withdrawals()}catch(e){alert('Error: '+e.message)}}function wallet(){$('main').innerHTML='<h1>Wallet Management</h1><div class="card"><p class="muted">Adjustments recorded as ledger transactions.</p><div class="form"><input id="wid" placeholder="User ID"><input id="wadj" type="number" placeholder="Amount"><button onclick="adjustWallet()" class="btn primary">Adjust</button><div id="wmsg" class="muted"></div></div></div>'}async function adjustWallet(){try{const d=await api('/admin/adjust',{method:'POST',body:JSON.stringify({userId:$('wid').value,amount:$('wadj').value})});$('wmsg').textContent='Adjusted.'}catch(e){$('wmsg').textContent='Error: '+e.message}}async function deposits(){try{const d=await api('/admin/deposits');page('deposits',null);$('main').innerHTML='<div class="section"><h1>Deposits</h1><button class="btn" onclick="deposits()">Refresh</button></div><div class="card"><table><tr><th>User</th><th>Amount</th><th>Status</th><th>Action</th></tr>'+(d.rows||[]).map(x=>'<tr><td>'+esc(x.user_email)+'</td><td>'+money(x.amount_minor)+'</td><td>'+x.status+'</td><td><button class="btn" onclick="reviewDeposit(\''+x.id+'\',true)">✓</button></td></tr>').join('')+'</table></div>'}catch(e){console.error(e)}}async function withdrawals(){try{const d=await api('/admin/withdrawals');page('withdrawals',null);$('main').innerHTML='<div class="section"><h1>Withdrawals</h1><button class="btn" onclick="withdrawals()">Refresh</button></div><div class="card"><table><tr><th>User</th><th>Amount</th><th>Status</th></tr>'+(d.rows||[]).map(x=>'<tr><td>'+esc(x.user_email)+'</td><td>'+money(x.amount_minor)+'</td><td>'+x.status+'</td></tr>').join('')+'</table></div>'}catch(e){console.error(e)}}function roundCard(r,i){const p=dtParts(r.start_at),entry=price(r.entry_price_micros),exit=price(r.exit_price_micros);return '<div class="card roundCard"><h2>ROUND '+r.round_no+'</h2><div class="form"><label>Entry Price (micros)<input id="entry'+i+'" type="number" value="'+r.entry_price_micros+'"></label><label>Exit Price (micros)<input id="exit'+i+'" type="number" value="'+r.exit_price_micros+'"></label><button onclick="saveRound('+r.round_no+','+i+')" class="btn primary">Save</button><div class="muted">Current: '+entry+' → '+exit+'</div></div></div>'}async function rounds(){try{const d=await api('/admin/rounds');page('rounds',null);$('main').innerHTML='<div class="section"><h1>Round Manager</h1><button class="btn" onclick="rounds()">Refresh</button></div><div class="grid">'+(d.rows||[]).map((r,i)=>roundCard(r,i)).join('')+'</div>'}catch(e){console.error(e)}}async function saveRound(no,i){try{const entry=Number($('entry'+i).value),exit=Number($('exit'+i).value);if(!(entry>0)||!(exit>0))throw Error('Entry & Exit prices required.');await api('/admin/round-save',{method:'POST',body:JSON.stringify({roundNo:no,entryPriceMicros:entry,exitPriceMicros:exit})});rounds()}catch(e){alert('Error: '+e.message)}}async function trades(){try{const d=await api('/admin/trades');page('trades',null);$('main').innerHTML='<div class="section"><h1>Trading History</h1><button class="btn" onclick="trades()">Refresh</button></div><div class="card"><table><tr><th>User</th><th>Round</th><th>Entry</th><th>Exit</th><th>Status</th></tr>'+(d.rows||[]).map(t=>'<tr><td>'+esc(t.user_email)+'</td><td>'+t.round_no+'</td><td>'+price(t.entry_price_micros)+'</td><td>'+price(t.exit_price_micros)+'</td><td>'+t.status+'</td></tr>').join('')+'</table></div>'}catch(e){console.error(e)}}async function settings(){return settingsSection('deposit')}async function settingsSection(section,el){try{closeMenu();document.querySelectorAll('#menu button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');const d=await api('/admin/settings');const s=d.settings||{};const html='<div class="section"><h1>Settings</h1></div><div class="card form"><label>Preferred Network<select id="prefNet" onchange="saveSettingsSection(\'deposit\')"><option value="TRC20" '+(s.preferred_network==='TRC20'?'selected':'')+'>>TRC20</option><option value="ERC20" '+(s.preferred_network==='ERC20'?'selected':'')+'>>ERC20</option></select></label><label>Minimum Deposit (USDT)<input id="minDep" type="number" value="'+(Number(s.minimum_deposit_minor||0)/100)+'" onchange="saveSettingsSection(\'deposit\')"></label><label>TRC20 Address<input id="trc20" value="'+(s.trc20_deposit_address||'')+'" onchange="saveSettingsSection(\'deposit\')"></label><label>ERC20 Address<input id="erc20" value="'+(s.erc20_deposit_address||'')+'" onchange="saveSettingsSection(\'deposit\')"></label><div id="msg" class="muted"></div></div>';$('main').innerHTML=html}catch(e){console.error(e)}}async function saveSettingsSection(section){try{const d=await api('/admin/settings');const s=d.settings||{};const b={preferredNetwork:$('prefNet').value,trc20DepositAddress:$('trc20').value,erc20DepositAddress:$('erc20').value,minimumDepositMinor:Number($('minDep').value)*100};await api('/admin/settings',{method:'POST',body:JSON.stringify(b)});document.getElementById('msg').textContent='Saved!'}catch(e){document.getElementById('msg').textContent='Error: '+e.message}}async function referrals(){try{const d=await api('/admin/referrals');const s=d.settings||{};const list=d.referrals||[];page('referrals',null);const enabled=s.referral_enabled==='1'?'checked':'';const reward=Number(s.referral_reward_minor||0)/100;const minDep=Number(s.referral_min_deposit_minor||0)/100;$('main').innerHTML='<div class="section"><h1>🔗 Referral System</h1><button class="btn" onclick="referrals()">Refresh</button></div><div class="card form"><h2>Settings</h2><label><input type="checkbox" id="refEnabled" '+enabled+' onchange="saveReferralSettings()"> Enable Referrals</label><label>Reward per Referral (USDT)<input type="number" id="refReward" value="'+reward+'" step="0.01" min="0" onchange="saveReferralSettings()"></label><label>Minimum Deposit (USDT)<input type="number" id="refMin" value="'+minDep+'" step="0.01" min="0" onchange="saveReferralSettings()"></label><div id="refMsg" class="muted" style="margin-top:10px;"></div></div><div class="section" style="margin-top:20px"><h2>All Referrals ('+list.length+')</h2><div class="card"><table><tr><th>Referrer</th><th>Referred User</th><th>Status</th><th style="text-align:right">Reward</th><th>Date</th></tr>'+list.map(r=>'<tr><td><strong>'+esc(r.referrer_name||'N/A')+'</strong><br><span class="muted">'+esc(r.referrer_email||'N/A')+'</span></td><td><strong>'+esc(r.referred_name||'N/A')+'</strong><br><span class="muted">'+esc(r.referred_email||'N/A')+'</span></td><td><span class="badge '+(r.status==='approved'?'green':r.status==='pending'?'amber':'red')+'">'+r.status+'</span></td><td style="text-align:right">'+money(r.reward_minor||0)+'</td><td>'+new Date(r.created_at).toLocaleDateString()+'</td></tr>').join('')+'</table></div></div>'}catch(err){console.error(err);$('main').innerHTML='<h1>Referrals</h1><div class="card error">Error loading referrals</div>'}}async function saveReferralSettings(){try{const enabled=document.getElementById('refEnabled')?.checked||false;const reward=Number(document.getElementById('refReward')?.value||0);const minDep=Number(document.getElementById('refMin')?.value||0);await api('/admin/referrals',{method:'POST',body:JSON.stringify({enabled,reward,minDeposit:minDep})});const msg=document.getElementById('refMsg');if(msg){msg.textContent='✓ Saved!';msg.style.color='#0f0';setTimeout(()=>{msg.textContent=''},3000)}}catch(err){const msg=document.getElementById('refMsg');if(msg){msg.textContent='✗ Error: '+(err.message||'Unknown error');msg.style.color='#f00'}}}function logout(){fetch('/api/logout',{method:'POST'}).finally(()=>location.reload())}boot();</script></body></html>
