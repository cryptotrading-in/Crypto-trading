<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoTrade Client</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#070b12"><style>:root{--bg:#070b12;--panel:#0d131d;--line:#1d2938;--text:#f5f7fb;--muted:#8d9aac;--green:#22c55e;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}button,input,select{font:inherit}.bar{height:62px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:#080d15ee;backdrop-filter:blur(14px)}.btn{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:#111a26;color:#fff;cursor:pointer}.primary{background:#0ea5e9;border-color:#0ea5e9}.side{position:fixed;top:62px;bottom:0;left:0;width:245px;background:#090f17;border-right:1px solid var(--line);padding:14px;transform:translateX(-105%);transition:.28s;z-index:15}.side.open{transform:none}.side button{width:100%;display:block;text-align:left;padding:12px;border:0;background:none;color:#8d9aac;border-radius:9px;cursor:pointer}.side button:hover,.side button.active{background:#14202e;color:#fff}.main{max-width:1150px;margin:auto;padding:22px 15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.num{font-size:27px;font-weight:800}.muted{color:var(--muted)}.amber{color:var(--amber)}.green{color:var(--green)}.form{display:grid;gap:10px;max-width:650px}.form input,.form select{padding:11px;background:#09111b;color:#fff;border:1px solid var(--line);border-radius:9px}.auth{max-width:430px;margin:60px auto}.hidden{display:none!important}.spark{width:100%;height:70px}.market{min-height:180px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{padding:4px 8px;border-radius:99px;background:#172334;font-size:11px}.notice{padding:11px;border-radius:9px;background:#241b08;color:#fbbf24;border:1px solid #5b4310}.receiptBox{border:1px dashed #334155;border-radius:12px;padding:14px;text-align:center}.receiptBox input{display:block;width:100%;padding:10px;background:#09111b;color:#fff;border:1px solid var(--line);border-radius:9px}.receiptPreview{display:block;max-width:100%;max-height:260px;margin:10px auto;border-radius:10px;border:1px solid var(--line)}.addressRow{display:flex;gap:8px}.addressRow input{flex:1}.small{font-size:12px}.priceLine{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.tradeOverlay{position:fixed;inset:0;z-index:100;background:#070b12;overflow:auto;padding:20px}.tradePanel{max-width:620px;margin:24px auto}.countdown{font-size:44px;font-weight:800;text-align:center;margin:20px 0}.resultWin{border:1px solid #14532d}.resultLoss{border:1px solid #7f1d1d}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.rounds{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.rounds{grid-template-columns:1fr}.side{width:230px}.main{padding:16px 11px}.addressRow{flex-direction:column}.tradeOverlay{padding:12px}.tradePanel{margin:8px auto}}</style></head><body><div id="auth" class="auth card hidden"><h1 id="authTitle">Sign In</h1><div class="form"><input id="name" placeholder="Full name" class="hidden"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><input id="pin" inputmode="numeric" maxlength="4" placeholder="Recovery PIN (signup)" class="hidden"><input id="ref" placeholder="Referral code (optional)" class="hidden"><button class="btn primary" onclick="submitAuth()">Continue</button><button class="btn" onclick="toggleAuth()" id="switch">Create Account</button><p id="msg" class="muted"></p></div></div><div id="app" class="hidden"><div class="bar"><button class="btn" onclick="toggleMenu()">☰</button><strong style="margin-left:10px">CryptoTrade</strong><span id="balanceTop" class="muted" style="margin-left:auto"></span></div><aside id="side" class="side"><button onclick="page('home',this)">Home</button><button onclick="page('markets',this)">Markets</button><button onclick="page('wallet',this)">Wallet</button><button onclick="page('deposit',this)">Deposit</button><button onclick="page('withdraw',this)">Withdraw</button><button onclick="page('trading',this)">Trading</button><button onclick="page('profile',this)">Profile</button><button onclick="page('notifications',this)">Notifications</button><button onclick="logout()">Logout</button></aside><main id="main" class="main"></main></div><script>
const $=id=>document.getElementById(id);const api=async(p,o={},attempt=0)=>{let r;try{r=await fetch('/api'+p,{...o,credentials:'include',cache:'no-store',headers:{'content-type':'application/json',...(o.headers||{})}})}catch(e){if(attempt<2){await new Promise(x=>setTimeout(x,350*(attempt+1)));return api(p,o,attempt+1)}throw e}let d={};try{d=await r.json()}catch{}if(!r.ok||d.ok===false){if(attempt<2&&r.status>=500){await new Promise(x=>setTimeout(x,350*(attempt+1)));return api(p,o,attempt+1)}const e=Error(d.error||'Request failed');e.status=r.status;throw e}return d};const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=x=>Number(x||0).toFixed(2);const toPkt=x=>{const t=new Date(x||Date.now());return new Date(t.getTime()+(5*60+t.getTimezoneOffset())*60000)};const date=x=>{if(!x)return'-';const d=toPkt(x);return Number.isNaN(d.getTime())?esc(x):String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear()};const price=x=>Number(x||0)/1000000;let signup=false,state=null,depositConfig=null,receiptData='';
function showAuth(message=''){ $('app').classList.add('hidden');$('auth').classList.remove('hidden');$('msg').textContent=message }
function toggleAuth(){signup=!signup;$('authTitle').textContent=signup?'Create Account':'Sign In';['name','pin','ref'].forEach(x=>$(x).classList.toggle('hidden',!signup));$('switch').textContent=signup?'Sign In':'Create Account';$('msg').textContent=''}
async function submitAuth(){try{const b={email:$('email').value.trim(),password:$('pass').value};if(signup){b.fullName=$('name').value.trim();b.recoveryPin=$('pin').value;b.referralCode=$('ref').value.trim()}await api(signup?'/signup':'/login',{method:'POST',body:JSON.stringify(b)});await start()}catch(e){showAuth(e.message)}}
async function start(){for(let attempt=0;attempt<3;attempt++){try{state=await api('/me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');await renderHome();return}catch(e){if(e.status===401&&attempt<2){await new Promise(x=>setTimeout(x,600));continue}if(e.status===401){$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('msg').textContent='Please sign in to continue.'}else{$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('msg').textContent='Connection issue. Retrying…';setTimeout(()=>start(),1200)}return}}}
async function refresh(){state=await api('/me');$('balanceTop').textContent='Available '+money(state.wallet?.available)+' USDT';return state}
function toggleMenu(){$('side').classList.toggle('open')}function closeMenu(){$('side').classList.remove('open')}
function page(p,el){closeMenu();document.querySelectorAll('#side button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');const f={home:renderHome,markets,wallet,deposit,withdraw,trading,profile,notifications}[p]||renderHome;Promise.resolve(f()).catch(e=>$('main').innerHTML='<div class="notice">'+esc(e.message)+'</div>')}
function roundButton(r){return r.unlocked?'<button class="btn primary" onclick="openTradeById(\''+esc(r.id)+'\')">Open Round</button>':'<button class="btn" onclick="page(\'deposit\')">Deposit to Unlock</button>'}
function renderRounds(s){return(s.rounds||[]).map(r=>{const t=new Date(r.start_at).getTime(),e=t+60000,n=Date.now(),live=r.enabled&&Number.isFinite(t)&&n>=t&&n<e;return'<div class="card"><span class="badge '+(r.unlocked?'green':'amber')+'">'+(r.unlocked?'UNLOCKED':'LOCKED')+'</span><h3>Round '+esc(r.round_no)+'</h3><p>'+esc(r.asset)+' · '+esc(r.action==='BUY'?'UP':'DOWN')+'</p><p class="priceLine"><span>Entry Price</span><b>'+price(r.entry_price_micros)+'</b></p><p class="priceLine"><span>Exit Price</span><b>'+price(r.exit_price_micros)+'</b></p><p class="muted">Unlock '+money((r.threshold_minor||0)/100)+' USDT · Profit '+esc(r.profit_pct)+'% · Fee '+esc(r.fee_pct)+'%</p><p class="muted">Start: '+date(r.start_at)+' · Entry: '+(live?'OPEN NOW':'scheduled')+'</p>'+roundButton(r)+'</div>'}).join('')}
async function renderHome(){const s=await refresh();$('main').innerHTML='<h1>Welcome, '+esc(s.user.full_name)+'</h1><div class="grid"><div class="card"><span class="muted">Available</span><div class="num">'+money(s.wallet.available)+' USDT</div></div><div class="card"><span class="muted">Reserved</span><div class="num">'+money(s.wallet.reserved)+' USDT</div></div><div class="card"><span class="muted">Account</span><div class="num">Active</div></div><div class="card"><span class="muted">Rounds</span><div class="num">5</div></div></div><h2>Trading Rounds</h2><div class="rounds">'+renderRounds(s)+'</div>'}
async function markets(){const pairs=[['BTC/USDT','BTCUSDT'],['ETH/USDT','ETHUSDT'],['SOL/USDT','SOLUSDT'],['ZEC/USDT','ZECUSDT']];$('main').innerHTML='<h1>Markets</h1><p class="muted">Live external market data is separate from platform-defined trading rounds.</p><div class="grid">'+pairs.map((p,i)=>'<div class="card market"><h3>'+p[0]+'</h3><div id="m'+i+'">Loading live market…</div></div>').join('')+'</div>';for(let i=0;i<pairs.length;i++){try{const r=await fetch('https://api.binance.com/api/v3/klines?symbol='+pairs[i][1]+'&interval=1m&limit=30');if(!r.ok)throw Error();const k=await r.json(),prices=k.map(x=>Number(x[4])),last=prices.at(-1),min=Math.min(...prices),max=Math.max(...prices),pts=prices.map((v,j)=>(j/(prices.length-1)*100)+','+(70-(v-min)/(max-min||1)*60)).join(' ');$('m'+i).innerHTML='<b>'+last.toLocaleString(undefined,{maximumFractionDigits:8})+'</b><svg class="spark" viewBox="0 0 100 70" preserveAspectRatio="none"><polyline fill="none" stroke="currentColor" stroke-width="1.5" points="'+pts+'"/></svg>'}catch{$('m'+i).innerHTML='<span class="muted">Live provider unavailable right now.</span>'}}}
async function wallet(){await refresh();$('main').innerHTML='<h1>Wallet</h1><div class="grid"><div class="card"><span class="muted">Available</span><div class="num">'+money(state.wallet.available)+' USDT</div></div><div class="card"><span class="muted">Reserved</span><div class="num">'+money(state.wallet.reserved)+' USDT</div></div></div><div class="card" style="margin-top:13px"><h2>Wallet Settings</h2><div class="form"><input id="waddr" value="'+esc(state.withdrawalAddress||'')+'" placeholder="TRC20 withdrawal address"><input id="wpin" type="password" inputmode="numeric" maxlength="4" placeholder="Set 4-digit withdrawal PIN"><button class="btn primary" onclick="saveWallet()">Save Wallet Settings</button><p id="wmsg" class="muted"></p></div></div>'}
async function saveWallet(){try{await api('/wallet/settings',{method:'POST',body:JSON.stringify({withdrawalAddress:$('waddr').value.trim(),withdrawalPin:$('wpin').value})});$('wmsg').textContent='Wallet settings saved.';await refresh()}catch(e){$('wmsg').textContent=e.message}}
async function loadDepositConfig(){depositConfig=await api('/deposit-settings');return depositConfig}
function networkOptions(c){const p=c.preferredNetwork==='ERC20'?'ERC20':'TRC20';const order=[p,p==='TRC20'?'ERC20':'TRC20'];return order.filter((n,i,a)=>a.indexOf(n)===i).map(n=>{const x=c.networks[n];return '<option value="'+n+'" '+(!x.supported?'disabled':'')+'>'+n+(n===p?' · Preferred':'')+(x.supported?'':' · Not configured')+'</option>'}).join('')}
function depositAddress(){const n=$('network').value,x=depositConfig?.networks?.[n];$('daddr').value=x?.address||'';$('networkNote').textContent=x?.supported?'Send USDT on '+n+' network to this Admin-configured address.':'This network is not configured by Admin.';$('copyAddr').disabled=!x?.address}
function copyDepositAddress(){const v=$('daddr').value;if(!v)return;navigator.clipboard?.writeText(v).then(()=>{$('copyMsg').textContent='Address copied.'}).catch(()=>{$('daddr').select();document.execCommand('copy');$('copyMsg').textContent='Address copied.'})}
function chooseReceipt(){receiptData='';$('receiptPreview').classList.add('hidden');$('receiptFile').value='';}
function receiptSelected(){const f=$('receiptFile').files?.[0];if(!f)return;if(!/^image\/(jpeg|png|webp)$/i.test(f.type)){alert('Please upload a JPG, PNG or WEBP receipt image.');$('receiptFile').value='';return}if(f.size>6000000){alert('Receipt image must be 6 MB or smaller.');$('receiptFile').value='';return}const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);receiptData=c.toDataURL('image/jpeg',.68);$('receiptPreview').src=receiptData;$('receiptPreview').classList.remove('hidden')};img.src=rd.result};rd.readAsDataURL(f)}
async function deposit(){try{const c=await loadDepositConfig();const min=Number(c.minimumDeposit||30);$('main').innerHTML='<h1>Deposit</h1><div class="card form"><div class="notice"><b>Current Minimum Deposit: '+money(min)+' USDT</b><br><span class="small">Pending deposits remain under Admin review and do not credit your balance or unlock rounds until approved.</span></div><label>Network<select id="network" onchange="depositAddress()">'+networkOptions(c)+'</select></label><div><label>Admin Deposit Address</label><div class="addressRow"><input id="daddr" readonly placeholder="Admin address will appear here"><button id="copyAddr" class="btn" onclick="copyDepositAddress()">Copy Address</button></div><p id="networkNote" class="muted small"></p><p id="copyMsg" class="muted small"></p></div><input id="amount" type="number" min="'+min+'" step="0.01" placeholder="Amount USDT"><input id="txid" placeholder="TXID / Hash"><div class="receiptBox"><b>Upload Screenshot / Receipt</b><p class="muted small">Select the receipt directly from your phone gallery or file picker. No URL is required.</p><input id="receiptFile" type="file" accept="image/jpeg,image/png,image/webp" onchange="receiptSelected()"><img id="receiptPreview" class="receiptPreview hidden" alt="Receipt preview"><button type="button" class="btn" onclick="chooseReceipt()">Change / Remove Receipt</button></div><button class="btn primary" onclick="sendDeposit()">Submit Deposit</button><p id="out" class="muted"></p></div>';depositAddress()}catch(e){$('main').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
async function sendDeposit(){try{const amount=Number($('amount').value);const min=Number(depositConfig?.minimumDeposit||30);if(!(amount>=min))throw Error('Minimum deposit is '+money(min)+' USDT.');if(!$('daddr').value)throw Error('Admin deposit address is not configured for this network.');if(!receiptData)throw Error('Please upload your deposit screenshot / receipt from Gallery.');const d=await api('/deposit',{method:'POST',body:JSON.stringify({network:$('network').value,amount:$('amount').value,txid:$('txid').value.trim(),receiptKey:receiptData})});$('out').textContent='Submitted: '+d.depositId+' · Status: '+d.status}catch(e){$('out').textContent=e.message}}
async function withdraw(){await refresh();$('main').innerHTML='<h1>Withdraw</h1><div class="card form"><p class="muted">Minimum withdrawal is controlled by Admin Settings. Funds are reserved immediately.</p><input value="'+esc(state.withdrawalAddress||'')+'" placeholder="Set address in Wallet Settings" readonly><input id="wa" type="number" min="0.01" placeholder="Amount USDT"><input id="wp" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit withdrawal PIN"><button class="btn primary" onclick="sendWithdrawal()">Submit Withdrawal</button><p id="out" class="muted"></p></div>'}
async function sendWithdrawal(){try{const d=await api('/withdrawal',{method:'POST',body:JSON.stringify({amount:$('wa').value,pin:$('wp').value})});$('out').textContent='Submitted: '+d.withdrawalId;await refresh()}catch(e){$('out').textContent=e.message}}
async function trading(){const s=await refresh();$('main').innerHTML='<h1>Trading</h1><p class="muted">Exactly five platform-defined rounds per 24-hour cycle. Select an eligible round to open its trade screen.</p><div class="rounds">'+s.rounds.map(r=>'<div class="card"><span class="badge '+(r.unlocked?'green':'amber')+'">'+(r.unlocked?'ELIGIBLE':'LOCKED')+'</span><h3>Round '+esc(r.round_no)+'</h3><p>'+esc(r.asset)+' · '+esc(r.action==='BUY'?'UP':'DOWN')+'</p><p>Entry Price: <b>'+price(r.entry_price_micros)+'</b></p><p>Exit Price: <b>'+price(r.exit_price_micros)+'</b></p><p>Duration: '+esc(r.duration_seconds)+' sec</p><p>Profit: '+esc(r.profit_pct)+'% · Fee: '+esc(r.fee_pct)+'%</p>'+roundButton(r)+'</div>').join('')+'</div>'}
function openTradeById(roundId){const r=(state?.rounds||[]).find(x=>x.id===roundId);if(!r||!r.unlocked)return;closeMenu();const old=document.getElementById('tradeScreen');if(old)old.remove();const el=document.createElement('div');el.id='tradeScreen';el.className='tradeOverlay';el.innerHTML='<div class="tradePanel"><div class="row" style="justify-content:space-between"><h1>Round '+esc(r.round_no)+'</h1><button class="btn" onclick="closeTradeScreen()">Close</button></div><div class="card"><p><b>'+esc(r.asset)+'</b> · Direction <b>'+esc(r.action==='BUY'?'UP':'DOWN')+'</b></p><p>Entry Price: <b>'+price(r.entry_price_micros)+'</b></p><p>Exit Price: <b>'+price(r.exit_price_micros)+'</b></p><p>Duration: <b>'+esc(r.duration_seconds)+' seconds</b></p><div id="tradeForm"><label>Amount USDT<input id="tamt" type="number" min="0.01" step="0.01" placeholder="Enter amount"></label><button class="btn primary" style="margin-top:12px;width:100%" onclick="enterTrade(\''+esc(r.id)+'\')">START TRADE</button><p id="tmsg" class="muted"></p></div></div></div>';document.body.appendChild(el)}
function closeTradeScreen(){if(window.__tradeTimer)clearInterval(window.__tradeTimer);document.getElementById('tradeScreen')?.remove()}
async function enterTrade(roundId){try{const r=(state?.rounds||[]).find(x=>x.id===roundId);if(!r||!(Number(r.entry_price_micros)>0)||!(Number(r.exit_price_micros)>0))throw Error('Admin has not configured Entry and Exit Prices for this round.');const amount=Number($('tamt').value);if(!(amount>0))throw Error('Enter a trade amount.');const d=await api('/trade/enter',{method:'POST',body:JSON.stringify({roundId,amount})});const form=$('tradeForm');form.innerHTML='<p class="green"><b>Trade started.</b></p><p class="muted">Your trade is active. It will close automatically when the duration ends.</p><div id="tradeCountdown" class="countdown">'+esc(r.duration_seconds)+'</div><p id="tradeStatus" class="muted"></p>';let left=Number(r.duration_seconds);window.__tradeTimer=setInterval(async()=>{left--;if($('tradeCountdown'))$('tradeCountdown').textContent=Math.max(0,left);if(left<=0){clearInterval(window.__tradeTimer);await autoSettleTrade(d.tradeId)}else if($('tradeStatus'))$('tradeStatus').textContent='Time remaining: '+left+' seconds'},1000)}catch(e){if($('tmsg'))$('tmsg').textContent=e.message}}
async function autoSettleTrade(tradeId){try{const d=await api('/trade/settle',{method:'POST',body:JSON.stringify({tradeId})});const screen=document.getElementById('tradeScreen');if(screen)screen.querySelector('.card').innerHTML='<div class="'+(d.result==='win'?'resultWin':'resultLoss')+' card"><h2>Trade Result: '+esc(String(d.result||'').toUpperCase())+'</h2><p>Net P/L: <b>'+esc(d.netPnl)+' USDT</b></p><button class="btn primary" onclick="clo
