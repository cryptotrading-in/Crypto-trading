name: Fix Referral Navigation
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch referral routes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('client.html')
          s=p.read_text()
          old="const CLIENT_ROUTES=['home','markets','wallet','deposit','withdraw','trading','profile','notifications'];"
          new="const CLIENT_ROUTES=['home','markets','wallet','deposit','withdraw','trading','profile','notifications','referrals'];"
          if old in s:
              s=s.replace(old,new,1)
          old2="const f={home:renderHome,markets,wallet,deposit,withdraw,trading,profile,notifications}[p]||renderHome;"
          new2="const f={home:renderHome,markets,wallet,deposit,withdraw,trading,profile,notifications,referrals}[p]||renderHome;"
          if old2 in s:
              s=s.replace(old2,new2,1)
          p.write_text(s)

          p=Path('admin.html')
          s=p.read_text()
          old="function page(p,el){closeMenu();document.querySelectorAll('#menu button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');({dashboard,users,wallet,deposits,withdrawals,rounds,trades,settings}[p]||dashboard)()}"
          new="function page(p,el){closeMenu();document.querySelectorAll('#menu button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');({dashboard,users,wallet,deposits,withdrawals,rounds,trades,referrals,settings}[p]||dashboard)()}"
          if old in s:
              s=s.replace(old,new,1)
          marker='async function boot()'
          if 'async function referrals(){' not in s:
              fn="""async function referrals(){try{const d=await api('/admin/referrals');const st=d.stats||{};const cfg=d.settings||{};const rows=d.rows||[];$('main').innerHTML='<div class=\\\"section\\\"><h1>Referrals</h1><button class=\\\"btn\\\" onclick=\\\"referrals()\\\">Refresh</button></div><div class=\\\"grid\\\"><div class=\\\"card\\\">Total Referrals<div class=\\\"num\\\">'+(st.total??0)+'</div></div><div class=\\\"card\\\">Qualified<div class=\\\"num\\\">'+(st.qualified??0)+'</div></div><div class=\\\"card\\\">Pending<div class=\\\"num\\\">'+(st.pending??0)+'</div></div><div class=\\\"card\\\">Rewards Paid<div class=\\\"num\\\">'+(st.rewardsPaid??st.paid??0)+'</div></div></div><div class=\\\"card\\\" style=\\\"margin-top:13px\\\"><h2>Referral Settings</h2><div class=\\\"form\\\"><label class=\\\"fieldLabel\\\">Program <select id=\\\"refEnabled\\\"><option value=\\\"1\\\" '+(cfg.enabled?'selected':'')+'>Enabled</option><option value=\\\"0\\\" '+(!cfg.enabled?'selected':'')+'>Disabled</option></select></label><label class=\\\"fieldLabel\\\">Reward per qualified referral (USDT)<input id=\\\"refReward\\\" type=\\\"number\\\" step=\\\"0.01\\\" min=\\\"0\\\" value=\\\"'+esc(cfg.reward??5)+'\\\"></label><label class=\\\"fieldLabel\\\">Minimum qualifying deposit (USDT)<input id=\\\"refMin\\\" type=\\\"number\\\" step=\\\"0.01\\\" min=\\\"0\\\" value=\\\"'+esc(cfg.minimumDeposit??50)+'\\\"></label><label class=\\\"fieldLabel\\\">Hold hours<input id=\\\"refHold\\\" type=\\\"number\\\" step=\\\"1\\\" min=\\\"0\\\" value=\\\"'+esc(cfg.holdHours??0)+'\\\"></label><button class=\\\"btn primary\\\" onclick=\\\"saveReferralSettings()\\\">Save Referral Settings</button><p id=\\\"refMsg\\\" class=\\\"muted\\\"></p></div></div><div class=\\\"card\\\" style=\\\"margin-top:13px\\\"><h2>Referral Activity</h2><div class=\\\"tablewrap\\\"><table class=\\\"table\\\"><tr><th>Client</th><th>Referrer</th><th>Status</th><th>Created</th><th>Qualified</th></tr>'+rows.map(x=>'<tr><td>'+esc(x.full_name||x.referred_name||'—')+'<br><small>'+esc(x.email||x.referred_email||'')+'</small></td><td>'+esc(x.referrer_name||x.referrer_email||x.referrer_id||'—')+'</td><td><span class=\\\"pill\\\">'+esc(x.status||'pending')+'</span></td><td>'+date(x.created_at)+'</td><td>'+date(x.qualified_at)+'</td></tr>').join('')+'</table></div></div>'}catch(e){$('main').innerHTML='<div class=\\\"notice\\\">'+esc(e.message)+'</div>'}}async function saveReferralSettings(){try{await api('/admin/referral-settings',{method:'POST',body:JSON.stringify({enabled:$('refEnabled').value==='1',reward:$('refReward').value,minimumDeposit:$('refMin').value,holdHours:$('refHold').value})});$('refMsg').textContent='Referral settings saved.';await referrals()}catch(e){$('refMsg').textContent=e.message}}\n"""
              s=s.replace(marker,fn+marker,1)
          if '<script src=\"/navigation.js\"></script>' not in s:
              s=s.replace('</body>','<script src=\"/navigation.js\"></script></body>',1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check worker.js
          node --check navigation.js
          python3 - <<'PY'
          from pathlib import Path
          for f in ['client.html','admin.html']:
              s=Path(f).read_text()
              assert 'referrals' in s, f
          print('Referral navigation source checks passed')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client.html admin.html .github/workflows/fix-referral-navigation.yml
          git commit -m 'Fix client and admin referral navigation' || exit 0
          git rm .github/workflows/fix-referral-navigation.yml
          git commit -m 'Remove temporary referral navigation workflow'
          git push
