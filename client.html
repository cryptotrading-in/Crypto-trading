<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoTrade Client</title><style>:root{--bg:#070b12;--panel:#0d131d;--line:#1d2938;--text:#f5f7fb;--muted:#8d9aac;--blue:#38bdf8;--green:#22c55e;--red:#ef4444;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}button,input,select,textarea{font:inherit}.bar{height:62px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:#080d15ee;backdrop-filter:blur(14px)}.btn{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:#111a26;color:#fff;cursor:pointer}.primary{background:#0ea5e9;border-color:#0ea5e9}.side{position:fixed;top:62px;bottom:0;left:0;width:245px;background:#090f17;border-right:1px solid var(--line);padding:14px;transform:translateX(-105%);transition:.28s;z-index:15}.side.open{transform:none}.side button{width:100%;display:block;text-align:left;padding:12px;border:0;background:none;color:var(--muted);border-radius:9px;cursor:pointer}.side button:hover,.side button.active{background:#14202e;color:#fff}.main{max-width:1150px;margin:auto;padding:22px 15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.num{font-size:27px;font-weight:800}.muted{color:var(--muted)}.amber{color:var(--amber)}.green{color:var(--green)}.red{color:var(--red)}.form{display:grid;gap:10px;max-width:650px}.form input,.form select,.form textarea{padding:11px;background:#09111b;color:#fff;border:1px solid var(--line);border-radius:9px}.auth{max-width:430px;margin:60px auto}.hidden{display:none!important}.spark{width:100%;height:70px}.market{min-height:180px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{padding:4px 8px;border-radius:99px;background:#172334;font-size:11px}.notice{padding:11px;border-radius:9px;background:#241b08;color:#fbbf24;border:1px solid #5b4310}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.rounds{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.rounds{grid-template-columns:1fr}.side{width:230px}.main{padding:16px 11px}}</style></head><body><div id="auth" class="auth card"><h1 id="authTitle">Sign In</h1><div class="form"><input id="name" placeholder="Full name" class="hidden"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><input id="pin" inputmode="numeric" maxlength="4" placeholder="Recovery PIN (signup)" class="hidden"><input id="ref" placeholder="Referral code (optional)" class="hidden"><button class="btn primary" onclick="submitAuth()">Continue</button><button class="btn" onclick="toggleAuth()" id="switch">Create Account</button><p id="msg" class="muted"></p></div></div><div id="app" class="hidden"><div class="bar"><button class="btn" onclick="toggleMenu()">☰</button><strong style="margin-left:10px">CryptoTrade</strong><span id="balanceTop" class="muted" style="margin-left:auto"></span></div><aside id="side" class="side"><button onclick="page('home',this)">Home</button><button onclick="page('markets',this)">Markets</button><button onclick="page('wallet',this)">Wallet</button><button onclick="page('deposit',this)">Deposit</button><button onclick="page('withdraw',this)">Withdraw</button><button onclick="page('trading',this)">Trading</button><button onclick="page('profile',this)">Profile</button><button onclick="page('notifications',this)">Notifications</button><button onclick="logout()">Logout</button></aside><main id="main" class="main"></main></div><script>
const $=id=>document.getElementById(id),api=async(p,o={})=>{const r=await fetch('/api'+p,{...o,headers:{'content-type':'application/json',...(o.headers||{})}});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'Request failed');return d},esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let signup=false,state=null;
function toggleAuth(){signup=!signup;$('authTitle').textContent=signup?'Create Account':'Sign In';['name','pin','ref'].forEach(x=>$(x).classList.toggle('hidden',!signup));$('switch').textContent=signup?'Sign In':'Create Account';$('msg').textContent=''}async function submitAuth(){try{const b={email:$('email').value.trim(),password:$('pass').value};if(signup){b.fullName=$('name').value.trim();b.recoveryPin=$('pin').value;b.referralCode=$('ref').value.trim()}await api(signup?'/signup':'/login',{method:'POST',body:JSON.stringify(b)});await start()}catch(e){$('msg').textContent=e.message}}async function start(){try{state=await api('/me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');renderHome()}catch{}}async function refresh(){state=await api('/me');$('balanceTop').textContent='Available '+state.wallet.available+' USDT';return state}function toggleMenu(){$('side').classList.toggle('open')}function closeMenu(){$('side').classList.remove('open')}function page(p,el){closeMenu();document.querySelectorAll('#side button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');({home:renderHome,markets,wallet,deposit,withdraw,trading,profile,notifications}[p]||renderHome)()}
function roundButton(r){return r.unlocked?'<button class="btn primary" onclick="openTradeById(\''+esc(r.id)+'\')">Open Round</button>':'<button class="btn" onclick="page(\'deposit\')">Deposit to Unlock</button>'}function renderRounds(s){return s.rounds.map(r=>{const live=r.enabled&&Date.now()>=new Date(r.start_at).getTime()&&Date.now()<=new Date(r.start_at).getTime()+60000;return '<div class="card"><span class="badge '+(r.unlocked?'green':'amber')+'">'+(r.unlocked?'UNLOCKED':'LOCKED')+'</span><h3>Round '+r.round_no+'</h3><p>'+esc(r.asset)+' · '+esc(r.action)+'</p><p class="muted">Unlock '+(r.threshold_minor/100)+' USDT · Profit '+r.profit_pct+'% · Fee '+r.fee_pct+'%</p><p class="muted">Entry window: '+(live?'OPEN NOW':'scheduled')+'</p>'+roundButton(r)+'</div>'}).join('')}
async function renderHome(){try{const s=await refresh();$('main').innerHTML='<h1>Welcome, '+esc(s.user.full_name)+'</h1><div class="grid"><div class="card"><span class="muted">Available</span><div class="num">'+s.wallet.available+' USDT</div></div><div class="card"><span class="muted">Reserved</span><div class="num">'+s.wallet.reserved+' USDT</div></div><div class="card"><span class="muted">Account</span><div class="num">Active</div></div><div class="card"><span class="muted">Rounds</span><div class="num">5</div></div></div><h2>Trading Rounds</h2><div class="rounds">'+renderRounds(s)+'</div>'}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}
async function markets(){const pairs=[['BTC/USDT','BTCUSDT'],['ETH/USDT','ETHUSDT'],['SOL/USDT','SOLUSDT'],['ZEC/USDT','ZECUSDT']];$('main').innerHTML='<h1>Markets</h1><p class="muted">Live external market data is separate from platform-defined trading rounds.</p><div class="grid">'+pairs.map((p,i)=>'<div class="card market"><h3>'+p[0]+'</h3><div id="m'+i+'">Loading live market…</div></div>').join('')+'</div>';for(let i=0;i<pairs.length;i++){try{const r=await fetch('https://api.binance.com/api/v3/klines?symbol='+pairs[i][1]+'&interval=1m&limit=30');if(!r.ok)throw Error();const k=await r.json(),prices=k.map(x=>Number(x[4])),last=prices[prices.length-1],min=Math.min(...prices),max=Math.max(...prices),pts=prices.map((v,j)=>(j/(prices.length-1)*100)+','+(70-(v-min)/(max-min||1)*60)).join(' ');$('m'+i).innerHTML='<b>'+last.toLocaleString(undefined,{maximumFractionDigits:8})+'</b><svg class="spark" viewBox="0 0 100 70" preserveAspectRatio="none"><polyline fill="none" stroke="currentColor" stroke-width="1.5" points="'+pts+'"/></svg>'}catch{$('m'+i).innerHTML='<span class="muted">Live provider unavailable right now.</span>'}}}
async function wallet(){try{await refresh();$('main').innerHTML='<h1>Wallet</h1><div class="grid"><div class="card"><span class="muted">Available</span><div class="num">'+state.wallet.available+' USDT</div></div><div class="card"><span class="muted">Reserved</span><div class="num">'+state.wallet.reserved+' USDT</div></div></div><div class="card" style="margin-top:13px"><h2>Wallet Settings</h2><div class="form"><input id="waddr" value="'+esc(state.withdrawalAddress||'')+'" placeholder="TRC20 withdrawal address"><input id="wpin" type="password" inputmode="numeric" maxlength="4" placeholder="Set 4-digit withdrawal PIN"><button class="btn primary" onclick="saveWallet()">Save Wallet Settings</button><p id="wmsg" class="muted"></p></div></div>')}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}async function saveWallet(){try{await api('/wallet/settings',{method:'POST',body:JSON.stringify({withdrawalAddress:$('waddr').value.trim(),withdrawalPin:$('wpin').value})});$('wmsg').textContent='Wallet settings saved.';await refresh()}catch(e){$('wmsg').textContent=e.message}}
function deposit(){$('main').innerHTML='<h1>Deposit</h1><div class="card form"><p class="muted">TRC20 preferred · ERC20 supported · Minimum 30 USDT. The destination address is controlled by Admin Settings.</p><select id="network"><option>TRC20</option><option>ERC20</option></select><input id="amount" type="number" min="30" step="0.01" placeholder="Amount USDT"><input id="txid" placeholder="TXID / Hash"><button class="btn primary" onclick="sendDeposit()">Submit Deposit</button><p class="muted">Use the deposit address currently configured by the platform Admin for the selected network.</p><p id="out" class="muted"></p></div>'}async function sendDeposit(){try{const d=await api('/deposit',{method:'POST',body:JSON.stringify({network:$('network').value,amount:$('amount').value,txid:$('txid').value})});$('out').textContent='Submitted: '+d.depositId}catch(e){$('out').textContent=e.message}}
async function withdraw(){try{await refresh();$('main').innerHTML='<h1>Withdraw</h1><div class="card form"><p class="muted">Minimum withdrawal is controlled by Admin Settings. Funds are reserved immediately.</p><input value="'+esc(state.withdrawalAddress||'')+'" placeholder="Set address in Wallet Settings" readonly><input id="wa" type="number" min="0.01" placeholder="Amount USDT"><input id="wp" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit withdrawal PIN"><button class="btn primary" onclick="sendWithdrawal()">Submit Withdrawal</button><p id="out" class="muted"></p></div>')}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}async function sendWithdrawal(){try{const d=await api('/withdrawal',{method:'POST',body:JSON.stringify({amount:$('wa').value,pin:$('wp').value})});$('out').textContent='Submitted: '+d.withdrawalId;await refresh()}catch(e){$('out').textContent=e.message}}
async function trading(){try{const s=await refresh();$('main').innerHTML='<h1>Trading</h1><p class="muted">Exactly five platform-defined rounds per 24-hour cycle. Entry window is 60 seconds after each configured start time.</p><div class="rounds">'+s.rounds.map(r=>'<div class="card"><span class="badge '+(r.unlocked?'green':'amber')+'">'+(r.unlocked?'ELIGIBLE':'LOCKED')+'</span><h3>Round '+r.round_no+'</h3><p>'+esc(r.asset)+' · '+esc(r.action)+'</p><p>Duration: '+r.duration_seconds+' sec</p><p>Profit: '+r.profit_pct+'% · Fee: '+r.fee_pct+'%</p>'+roundButton(r)+'</div>').join('')+'</div><div id="tradeBox" style="margin-top:15px"></div>'}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}function openTradeById(roundId){const r=(state?.rounds||[]).find(x=>x.id===roundId);if(!r)return;const box=$('tradeBox');if(!box){trading().then(()=>setTimeout(()=>openTradeById(roundId),250));return}box.innerHTML='<div class="card form"><h2>Round '+r.round_no+' · '+esc(r.asset)+'</h2><p>Platform action: <b>'+esc(r.action)+'</b></p><input id="tamt" type="number" min="0.01" step="0.01" placeholder="Trade amount USDT"><input id="entry" type="number" min="0.000001" step="0.000001" placeholder="Entry price"><div class="row"><button class="btn primary" onclick="enterTrade(\''+esc(r.id)+'\')">Enter '+esc(r.action)+'</button><button class="btn" onclick="$(\'tradeBox\').innerHTML=\'\'">Close</button></div><p id="tmsg" class="muted"></p></div>'}async function enterTrade(roundId){try{const d=await api('/trade/enter',{method:'POST',body:JSON.stringify({roundId,amount:$('tamt').value,entryPriceMicros:Math.round(Number($('entry').value)*1000000)})});$('tmsg').innerHTML='Trade opened: <b>'+esc(d.tradeId)+'</b><br>After the configured duration, settlement can be requested.';const box=$('tradeBox');box.innerHTML+='<button class="btn primary" style="margin-top:8px" onclick="settleTrade(\''+esc(d.tradeId)+'\')">Settle Trade</button>'}catch(e){$('tmsg').textContent=e.message}}async function settleTrade(tradeId){try{const result=confirm('Settle this trade as WIN? Cancel = LOSS.');const d=await api('/trade/settle',{method:'POST',body:JSON.stringify({tradeId,result:result?'win':'loss'})});$('tradeBox').innerHTML='<div class="card"><b>Trade settled: '+esc(d.result)+'</b><p>Net P/L: '+esc(d.netPnl)+' USDT</p></div>';await refresh()}catch(e){const x=$('tmsg');if(x)x.textContent=e.message}}
async function profile(){try{await refresh();$('main').innerHTML='<h1>Profile</h1><div class="card form"><label>Full name<input value="'+esc(state.user.full_name)+'" readonly></label><label>Email<input value="'+esc(state.user.email)+'" readonly></label><label>Country<input value="'+esc(state.user.country||'')+'" readonly></label><label>Referral code<input value="'+esc(state.user.referral_code||'')+'" readonly></label><p class="muted">Registration: '+new Date(state.user.created_at).toLocaleString()+'</p><button class="btn primary" onclick="wallet()">Wallet Settings</button></div>')}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}async function notifications(){try{const d=await api('/notifications');$('main').innerHTML='<h1>Notifications</h1>'+((d.rows||[]).map(n=>'<div class="card" style="margin:8px 0"><b>'+esc(n.title)+'</b><p class="muted">'+esc(n.body)+'</p><small class="muted">'+new Date(n.created_at).toLocaleString()+'</small></div>').join('')||'<div class="card muted">No notifications yet.</div>')}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}function logout(){fetch('/api/logout',{method:'POST'}).finally(()=>location.reload())}start();</script></body></html>
