<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoTrade Client</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/glassmorphism.css"><style>:root{--primary:#0f0;--bg:#000;--card:#1a1a2e;--text:#fff;--muted:#999}body{margin:0;padding:0;font-family:sans-serif;background:linear-gradient(135deg,#000,#1a0033);color:var(--text);overflow-x:hidden}#auth,#app{transition:opacity .3s}#auth.hidden,#app.hidden{display:none}input,button{padding:10px;margin:5px 0;border:none;border-radius:6px;background:#333;color:#fff}button{cursor:pointer;background:var(--primary);color:#000;font-weight:bold}button:hover{opacity:.8}button.btn{background:#333;color:#fff}button.btn.primary{background:var(--primary);color:#000}.card{background:var(--card);border:1px solid #333;border-radius:8px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.section{margin-top:20px}.muted{color:var(--muted);font-size:.9em}.num{font-size:2em;font-weight:bold;margin:10px 0}.form label{display:block;margin:10px 0}table{width:100%;border-collapse:collapse}table th,table td{padding:8px;text-align:left;border-bottom:1px solid #333}#side{position:fixed;left:0;top:0;width:250px;height:100vh;background:#1a1a2e;padding:20px;overflow-y:auto;transform:translateX(-100%);transition:transform .3s;z-index:1000}#side.open{transform:translateX(0)}#side button{width:100%;text-align:left;margin:5px 0}.hidden{display:none!important}.error{color:#f00}.success{color:var(--primary)}#menu{position:fixed;left:0;top:0;width:250px;height:100vh;background:#1a1a2e;padding:20px;overflow-y:auto;transform:translateX(-100%);transition:transform .3s;z-index:1000}#menu.open{transform:translateX(0)}</style></head><body><div id="auth" class="hidden"><div class="card" style="max-width:400px;margin:50px auto"><h1 id="authTitle">Sign In</h1><div id="msg" class="muted"></div><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><input id="name" type="text" placeholder="Full Name" class="hidden"><input id="pin" type="text" placeholder="Recovery PIN" class="hidden"><input id="ref" type="text" placeholder="Referral Code (optional)" class="hidden"><button onclick="submitAuth()">Submit</button><button class="btn" onclick="toggleAuth()" id="switch">Create Account</button></div></div><div id="app" class="hidden"><div id="side"><button onclick="page('home')" class="active">Home</button> <button onclick="page('markets')">Markets</button> <button onclick="page('wallet')">Wallet</button> <button onclick="page('deposit')">Deposit</button> <button onclick="page('withdraw')">Withdraw</button> <button onclick="page('trading')">Trading</button> <button onclick="page('profile')">Profile</button> <button onclick="page('notifications')">Notifications</button> <button onclick="page('referrals')">💰 Refer & Earn</button> <button onclick="logout()" style="margin-top:20px">Logout</button></div><div style="display:flex;align-items:center;justify-content:space-between;padding:15px"><h1 style="margin:0">CryptoTrade</h1><div style="text-align:right"><div class="muted">Balance</div><div id="balanceTop" class="num" style="margin:0">Loading...</div></div><button class="btn" onclick="toggleMenu()" style="width:auto">☰</button></div><div id="main" style="padding:20px;max-width:1200px;margin:0 auto"></div></div><script>let signup=false,state={},depositConfig={};const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>(Number(n||0)/100).toFixed(2);const api=async(p,o={},attempt=0)=>{let r;try{r=await fetch('/api'+p,{...o,credentials:'include',cache:'no-store',headers:{'content-type':'application/json',...(o.headers||{})}});if(!r.ok)throw{status:r.status,text:await r.text()};return await r.json()}catch(e){if(attempt<2&&(!e.status||e.status===500||e.status===408))return new Promise(x=>setTimeout(()=>x(api(p,o,attempt+1)),500+Math.random()*500));throw e}};function showAuth(message=''){$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('msg').textContent=message}function toggleAuth(){signup=!signup;$('authTitle').textContent=signup?'Create Account':'Sign In';['name','pin','ref'].forEach(x=>$(x).classList.toggle('hidden',!signup));$('switch').textContent=signup?'Sign In':'Create Account'}async function submitAuth(){try{const b={email:$('email').value.trim(),password:$('pass').value};if(signup){b.fullName=$('name').value.trim();b.recoveryPin=$('pin').value;b.referralCode=$('ref').value.trim()}const d=await api(signup?'/signup':'/login',{method:'POST',body:JSON.stringify(b)});if(!d.ok)throw Error(d.error||'Auth failed');state=await api('/me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');await renderHome()}catch(e){$('msg').textContent=String(e.message||e)}}async function start(){for(let attempt=0;attempt<3;attempt++){try{state=await api('/me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');await renderHome();return}catch(e){if(e.status===401){showAuth();return}if(attempt===2){$('msg').textContent='Connection failed.';throw e}}}}async function refresh(){state=await api('/me');$('balanceTop').textContent='Account Active';return state}function toggleMenu(){$('side').classList.toggle('open')}function closeMenu(){$('side').classList.remove('open')}const CLIENT_ROUTES=['home','markets','wallet','deposit','withdraw','trading','profile','notifications','referrals'];function page(p,el,fromHistory=false){closeMenu();document.querySelectorAll('#side button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');if(!fromHistory&&CLIENT_ROUTES.includes(p))history.pushState({ctPage:p},'',location.href);if(typeof window[p]==='function')window[p]()}function roundButton(r){return r.unlocked?'<button class="btn primary" onclick="openTradeById(\''+esc(r.id)+'\')">Open Round</button>':'<button class="btn" onclick="page(\'deposit\')">Deposit to Unlock</button>'}function renderRounds(s){return(s.rounds||[]).map(r=>{const t=new Date(r.start_at).getTime(),e=t+60000,n=Date.now(),live=r.enabled&&Number.isFinite(t)&&n>=t&&n<e;return'<div class="card"><span class="muted">ROUND '+r.round_no+'</span><div class="num">'+r.action+'</div><div class="muted">Entry: '+money(r.entry_price_micros)+' | Exit: '+money(r.exit_price_micros)+'</div><div class="muted">'+(live?'🔴 LIVE':new Date(t).toLocaleTimeString())+'</div>'+roundButton(r)+'</div>'}).join('')}async function renderHome(){const s=await refresh();const w=s.wallet||{};$('main').innerHTML='<h1>Welcome, '+esc(s.user.full_name)+'</h1><div class="homeHero"><div class="homeHeroKicker">CRYPTO TRADING</div><div class="num">'+money(w.available)+'</div><div class="muted">Available Balance</div></div><div class="grid">'+renderRounds(s)+'</div>'}async function markets(){const pairs=[['BTC/USDT','BTCUSDT'],['ETH/USDT','ETHUSDT'],['SOL/USDT','SOLUSDT'],['ZEC/USDT','ZECUSDT']];$('main').innerHTML='<h1>Markets</h1><p class="muted">Live external market prices.</p><div class="grid">'+pairs.map(([name,id])=>'<div class="card" id="'+id+'"><div>'+name+'</div><div class="num">$0.00</div></div>').join('')+'</div>'}async function wallet(){await refresh();$('main').innerHTML='<h1>Wallet</h1><div class="grid"><div class="card"><span class="muted">Available</span><div class="num">'+money(state.wallet.available)+'</div></div><div class="card"><span class="muted">Locked</span><div class="num">'+money(state.wallet.locked)+'</div></div></div><div class="card form"><label>Withdrawal Address<input id="waddr" value="'+(state.withdrawal_address||'')+'" readonly></label><label>Withdrawal PIN<input id="wpin" type="password" placeholder="Your PIN"></label><button onclick="saveWallet()" class="btn primary">Update</button><div id="wmsg" class="muted"></div></div>'}async function saveWallet(){try{await api('/wallet/settings',{method:'POST',body:JSON.stringify({withdrawalAddress:$('waddr').value.trim(),withdrawalPin:$('wpin').value})});$('wmsg').textContent='Saved.'}catch(e){$('wmsg').textContent='Error: '+e.message}}async function loadDepositConfig(){depositConfig=await api('/deposit-settings');return depositConfig}function networkOptions(c){const p=c.preferredNetwork==='ERC20'?'ERC20':'TRC20';const order=[p,p==='TRC20'?'ERC20':'TRC20'];return order.filter((n,i,a)=>a.indexOf(n)===i).map(n=>{const x=c.network?.[n];return'<option value="'+n+'"'+(p===n?' selected':'')+'>'+(x?.supported?n+' ✓':n+' ✗')+'</option>'}).join('')}function depositAddress(){const n=$('network').value,x=depositConfig?.networks?.[n];$('daddr').value=x?.address||'';$('networkNote').textContent=x?.supported?'Send USDT on '+n+' network to this Address':'Network not configured.'}function copyDepositAddress(){const v=$('daddr').value;if(!v)return;navigator.clipboard?.writeText(v).then(()=>{$('copyMsg').textContent='Copied.'}).catch(()=>{$('daddr').select();document.execCommand('copy')})}function chooseReceipt(){receiptData='';$('receiptPreview').classList.add('hidden');$('receiptFile').value=''}function receiptSelected(){const f=$('receiptFile').files?.[0];if(!f)return;if(!/^image\/(jpeg|png|webp)$/i.test(f.type)){alert('JPG, PNG or WEBP only.');$('receiptFile').value='';return}const r=new FileReader;r.onload=e=>{receiptData=e.target.result;$('receiptPreview').src=receiptData;$('receiptPreview').classList.remove('hidden')};r.readAsDataURL(f)}async function deposit(){try{const c=await loadDepositConfig();const min=Number(c.minimumDeposit||30);$('main').innerHTML='<h1>Deposit</h1><div class="card form"><div class="notice"><b>Min: '+money(min)+' USDT</b></div><label>Network<select id="network" onchange="depositAddress()">'+networkOptions(c)+'</select></label><label>USDT Address<input id="daddr" readonly></label><div class="muted" id="networkNote"></div><button class="btn" onclick="copyDepositAddress()">Copy Address</button><div id="copyMsg" class="muted"></div></div><div class="card form"><label>Deposit Amount<input id="amount" type="number" placeholder="30.00"></label><label>Upload Receipt<input id="receiptFile" type="file" accept="image/*" onchange="receiptSelected()"></label><img id="receiptPreview" class="hidden" style="max-width:100%;margin:10px 0;border-radius:6px;"><button onclick="chooseReceipt()" class="btn">Clear</button></div><div class="card form"><button onclick="sendDeposit()" class="btn primary">Submit Deposit</button><div id="out" class="muted"></div></div>';depositAddress()}catch(e){$('main').innerHTML='<h1>Deposit</h1><div class="card error">'+e.message+'</div>'}}async function sendDeposit(){try{const amount=Number($('amount').value);const min=Number(depositConfig?.minimumDeposit||30);if(!(amount>=min))throw Error('Minimum '+money(min)+' USDT');if(!receiptData)throw Error('Upload receipt');const d=await api('/deposit',{method:'POST',body:JSON.stringify({amount,network:$('network').value,receiptBase64:receiptData})});$('out').textContent='Submitted: '+d.depositId}catch(e){$('out').textContent='Error: '+e.message}}async function withdraw(){await refresh();const rows=state.withdrawals||[];const statusClass=s=>s==='completed'?'green':(s==='rejected'?'red':'amber');$('main').innerHTML='<h1>Withdraw</h1><div class="grid"><div class="card"><span class="muted">Available</span><div class="num">'+money(state.wallet.available)+'</div></div></div><div class="card form"><label>Amount<input id="wa" type="number" placeholder="100.00"></label><label>PIN<input id="wp" type="password" placeholder="Your PIN"></label><button onclick="sendWithdrawal()" class="btn primary">Withdraw</button><div id="out" class="muted"></div></div><div class="section"><h2>History</h2><div class="card">'+rows.map(r=>'<div style="padding:10px;border-bottom:1px solid #333"><div>'+money(r.amount)+' - <span class="badge '+statusClass(r.status)+'">'+r.status+'</span></div><div class="muted">'+new Date(r.created_at).toLocaleDateString()+'</div></div>').join('')+'</div></div>'}async function sendWithdrawal(){try{const d=await api('/withdrawal',{method:'POST',body:JSON.stringify({amount:$('wa').value,pin:$('wp').value})});$('out').textContent='Submitted: '+d.withdrawalId}catch(e){$('out').textContent='Error: '+e.message}}async function trading(){const s=await refresh();$('main').innerHTML='<h1>Trading</h1><p class="muted">Five platform rounds per 24h cycle.</p><div class="grid">'+renderRounds(s)+'</div>'}function openTradeById(roundId){const r=(state?.rounds||[]).find(x=>x.id===roundId);if(!r||!r.unlocked)return;closeMenu();const old=document.getElementById('tradeScreen');if(old)old.remove();const screen=document.createElement('div');screen.id='tradeScreen';screen.innerHTML='<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:2000"><div class="card" style="max-width:500px"><h2>ROUND '+r.round_no+'</h2><div class="muted">Action: '+r.action+'</div><div class="num">'+money(r.entry_price_micros)+'</div><div class="muted">Entry Price</div><div style="margin:20px 0"><div class="muted">Exit Price</div><div class="num">'+money(r.exit_price_micros)+'</div></div><div id="timer" class="muted"></div><button class="btn primary" onclick="enterTrade(\''+r.id+'\')">Enter Trade</button><button class="btn" onclick="closeTradeScreen()">Cancel</button></div></div>';document.body.appendChild(screen);const t=new Date(r.start_at).getTime();window.__tradeTimer=setInterval(()=>{const n=Math.max(0,60-(Date.now()-t)/1000|0);document.getElementById('timer').textContent=n+'s remaining';if(n===0)closeTradeScreen()},100)}function closeTradeScreen(){if(window.__tradeTimer)clearInterval(window.__tradeTimer);document.getElementById('tradeScreen')?.remove()}async function enterTrade(roundId){try{const r=(state?.rounds||[]).find(x=>x.id===roundId);if(!r||!(Number(r.entry_price_micros)>0)||!(Number(r.exit_price_micros)>0))throw Error('Not configured.');const d=await api('/trade/enter',{method:'POST',body:JSON.stringify({roundId})});closeTradeScreen();await refresh();await trading()}catch(e){alert('Error: '+e.message)}}async function autoSettleTrade(tradeId){try{const d=await api('/trade/settle',{method:'POST',body:JSON.stringify({tradeId})});const screen=document.getElementById('tradeScreen');if(screen)screen.querySelector('#timer').textContent='Trade settled!';await refresh()}catch(e){console.error(e)}}async function profile(){await refresh();$('main').innerHTML='<h1>Profile</h1><div class="card form"><label>Full name<input value="'+esc(state.user.full_name)+'" readonly></label><label>Email<input value="'+esc(state.user.email)+'" readonly></label><label>Country<input value="'+(state.user.country||'')+'" readonly></label><label>Phone<input value="'+(state.user.phone||'')+'" readonly></label></div>'}async function notifications(){const d=await api('/notifications');const items=d.notifications||d.items||d.rows||[];$('main').innerHTML='<h1>Notifications</h1><div class="card">'+(items.length?items.map(n=>'<div style="padding:10px;border-bottom:1px solid #333">'+esc(n.message)+'<div class="muted">'+new Date(n.created_at).toLocaleDateString()+'</div></div>').join(''):' <p class="muted">No notifications.</p>')+'</div>'}async function referrals(){try{const data=await api('/referrals');const state_data=await refresh();const referralCode=data.referralCode||state_data.user?.referral_code||'LOADING...';const referralLink=window.location.origin+'?ref='+referralCode;const referrals_list=data.referrals||[];const minDeposit=data.minimumDeposit||100;const reward=data.reward||0;const totalReferralReward=data.totalReferralReward||0;const html=`<h1>Refer & Earn 💰</h1><div class="grid"><div class="card"><span class="muted">Your Referral Code</span><div style="font-size:1.8em;font-weight:bold;margin:10px 0;font-family:monospace;word-break:break-all;">${esc(referralCode)}</div><button class="btn primary" onclick="copyReferralLink()">Copy Link</button><div id="copyRefMsg" class="muted" style="margin-top:8px;font-size:0.9em;"></div></div><div class="card"><span class="muted">Total Rewards</span><div class="num">${money(totalReferralReward)}</div></div><div class="card"><span class="muted">Per Referral</span><div class="num">${money(reward)}</div><p class="muted" style="font-size:0.85em;margin-top:8px;">Min deposit: ${money(minDeposit)}</p></div></div><div class="section" style="margin-top:20px;"><h2>Referrals (${referrals_list.length})</h2><div class="card">${referrals_list.length>0?'<table><tr><th>Name</th><th>Email</th><th>Status</th><th style="text-align:right">Reward</th></tr>'+referrals_list.map(r=>'<tr><td>'+esc(r.referred_name||'N/A')+'</td><td>'+esc(r.referred_email||'N/A')+'</td><td><span class="badge '+( r.status==='approved'?'green':'muted')+'">'+r.status+'</span></td><td style="text-align:right">'+money(r.reward_minor||0)+'</td></tr>').join('')+'</table>':'<p class="muted">No referrals yet. Share your code!</p>'}</div></div>`;$('main').innerHTML=html}catch(err){console.error(err);$('main').innerHTML='<h1>Refer & Earn</h1><div class="card error">Error loading referrals</div>'}}function copyReferralLink(){const code=document.querySelector('div[style*="monospace"]')?.textContent||'';if(!code)return alert('Code not found');const link=window.location.origin+'?ref='+code;navigator.clipboard?.writeText(link).then(()=>{const msg=document.getElementById('copyRefMsg');msg.textContent='✓ Copied!';setTimeout(()=>{msg.textContent=''},3000)}).catch(()=>{alert('Referral Link: '+link)})}async function logout(){try{await api('/logout',{method:'POST'})}catch{}location.reload()}if(!history.state?.ctPage)history.replaceState({ctPage:'home'},'',location.href);window.addEventListener('popstate',e=>{const p=CLIENT_ROUTES.includes(e.state?.ctPage)?e.state.ctPage:'home';page(p,null,true)});start();if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}</script></body></html>
