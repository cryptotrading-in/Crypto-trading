name: Fix referral flow
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-referral-flow.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only referral UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('client.html')
          s = p.read_text()
          start = s.find('<script>async function referrals(){')
          end = s.find('</script><script src="/navigation.js"></script>', start)
          if start < 0 or end < 0:
              raise SystemExit('client referral block not found')
          safe = r'''<script>async function referrals(){try{const d=await api('/referrals');if(!d.enabled){$('main').innerHTML='<div class="notice">Referral program is currently disabled.</div>';return}const rows=(d.rows||[]).map(v=>'<div class="priceLine"><span><b>'+esc(v.full_name)+'</b><br><small class="muted">'+esc(v.email)+'</small></span><span><b class="'+(v.status==='qualified'?'green':'amber')+'">'+esc(v.status)+'</b>'+(v.reward_amount?' <small class="green">+'+esc(v.reward_amount)+' USDT</small>':'')+'</span></div>').join('')||'<p class="muted">No referrals yet.</p>';$('main').innerHTML='<h1>Refer & Earn</h1><div class="card"><h2>Invite friends</h2><p class="muted">Earn <b>'+esc(d.settings.reward)+' USDT</b> when a referred client makes an approved qualifying deposit of at least <b>'+esc(d.settings.minimumDeposit)+' USDT</b>.</p><label class="small muted">Your referral link</label><input id="refLink" readonly value="'+esc(d.referralLink)+'"><div class="row" style="margin-top:9px"><button class="btn primary" onclick="copyReferralLink()">Copy Link</button><button class="btn" onclick="shareReferralLink()">Share</button><button class="btn" onclick="whatsappReferral()">WhatsApp</button></div><p id="refActionMsg" class="muted small"></p><p class="muted small">Your code: <b>'+esc(d.referralCode)+'</b></p></div><div class="grid" style="margin-top:13px"><div class="card">Total Referrals<div class="num">'+d.stats.total+'</div></div><div class="card">Qualified<div class="num">'+d.stats.qualified+'</div></div><div class="card">Pending<div class="num">'+d.stats.pending+'</div></div><div class="card">Earned<div class="num">'+esc(d.stats.totalEarned)+' USDT</div></div></div><div class="card" style="margin-top:13px"><h2>Referral Activity</h2>'+rows+'</div>'}catch(e){$('main').innerHTML='<div class="notice">'+esc(e.message)+'</div>}}async function copyReferralLink(){const v=$('refLink')?.value;if(!v)return;try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(v);else{const x=$('refLink');x.focus();x.select();document.execCommand('copy')}if($('refActionMsg'))$('refActionMsg').textContent='Referral link copied.'}catch{$('refActionMsg').textContent='Copy failed. Long-press the link and copy it manually.'}}async function shareReferralLink(){const v=$('refLink')?.value;if(!v)return;try{if(navigator.share)await navigator.share({title:'CryptoTrade Referral',text:'Join CryptoTrade using my referral link:',url:v});else await copyReferralLink()}catch{}}function whatsappReferral(){const v=$('refLink')?.value;if(v)location.href='https://wa.me/?text='+encodeURIComponent('Join CryptoTrade using my referral link: '+v)}</script>'''
          s = s[:start] + safe + s[end:]
          p.write_text(s)
      - name: Validate
        run: node --check worker.js
      - name: Commit referral-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client.html
          git commit -m "Fix referral link sharing and referral activity UI"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-referral-flow.yml
          git commit -m "Remove temporary referral flow fix workflow"
          git push
