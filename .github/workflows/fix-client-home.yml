name: Apply client home source fix

on:
  push:
    branches: [fix/client-home-source-of-truth]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('client.html')
          s = p.read_text()
          pattern = r"async function renderHome\(\)\{.*?\}\}\nasync function markets"
          replacement = '''async function renderHome(){const s=await refresh();$('main').innerHTML='<h1>Welcome, '+esc(s.user.full_name)+'</h1><div class="homeActions"><button type="button" class="card homeAction" onclick="page(\\'wallet\\')"><span class="muted">Balance</span><div class="num">'+money(s.wallet.available)+' USDT</div></button><button type="button" class="card homeAction" onclick="page(\\'deposit\\')"><span class="muted">Deposit</span><div class="num">Open</div></button><button type="button" class="card homeAction" onclick="page(\\'withdraw\\')"><span class="muted">Withdrawal</span><div class="num">'+money(s.wallet.withdrawal)+' USDT</div></button><button type="button" class="card homeAction" onclick="page(\\'trading\\')"><span class="muted">Rounds</span><div class="num">5</div></button></div>'}
async function markets'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('renderHome target not found exactly once; aborting')
          p.write_text(s2)

          sw = Path('sw.js')
          sw.write_text('''const CACHE="cryptotrade-shell-v3";const SHELL=["/","/index.html","/client.html","/manifest.json","/icon.svg"];self.addEventListener("install",e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(SHELL)).then(()=>self.skipWaiting()))});self.addEventListener("activate",e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});self.addEventListener("fetch",e=>{const u=new URL(e.request.url);if(u.origin!==location.origin||e.request.method!=="GET"||u.pathname.startsWith("/api/"))return;e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(CACHE).then(x=>x.put(e.request,c));return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match("/client.html")))});''')
          
          # Add the visual rules directly to the existing stylesheet instead of runtime injection.
          css = Path('glassmorphism.css')
          c = css.read_text()
          marker = '/* Client home action grid */'
          rules = marker + '\n.homeActions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.homeAction{width:100%;text-align:left;cursor:pointer;color:inherit}.homeAction:active{transform:scale(.99)}@media(max-width:520px){.homeActions{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}\n'
          if marker not in c:
              css.write_text(c+'\n'+rules)
          
          PY
          rm .github/workflows/fix-client-home.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client.html sw.js glassmorphism.css .github/workflows/fix-client-home.yml
          git diff --cached --check
          git commit -m "Fix client home navigation at source"
          git push origin HEAD:fix/client-home-source-of-truth