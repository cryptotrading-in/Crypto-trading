<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoTrade Client</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#070b12"><link rel="stylesheet" href="/glassmorphism.css"><style>:root{--bg:#070b12;--panel:#0d131d;--line:#1d2938;--text:#f5f7fb;--muted:#8d9aac;--green:#22c55e;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}button,input,select{font:inherit}.bar{height:62px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:#080d15ee;backdrop-filter:blur(14px)}.btn{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:#111a26;color:#fff;cursor:pointer}.primary{background:#0ea5e9;border-color:#0ea5e9}.side{position:fixed;top:62px;bottom:0;left:0;width:245px;background:#090f17;border-right:1px solid var(--line);padding:14px;transform:translateX(-105%);transition:.28s;z-index:15}.side.open{transform:none}.side button{width:100%;display:block;text-align:left;padding:12px;border:0;background:none;color:#8d9aac;border-radius:9px;cursor:pointer}.side button:hover,.side button.active{background:#14202e;color:#fff}.main{max-width:1150px;margin:auto;padding:22px 15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.num{font-size:27px;font-weight:800}.muted{color:var(--muted)}.amber{color:var(--amber)}.green{color:var(--green)}.form{display:grid;gap:10px;max-width:650px}.form input,.form select{padding:11px;background:#09111b;color:#fff;border:1px solid var(--line);border-radius:9px}.auth{max-width:430px;margin:60px auto}.hidden{display:none!important}.spark{width:100%;height:70px}.market{min-height:180px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{padding:4px 8px;border-radius:99px;background:#172334;font-size:11px}.notice{padding:11px;border-radius:9px;background:#241b08;color:#fbbf24;border:1px solid #5b4310}.receiptBox{border:1px dashed #334155;border-radius:12px;padding:14px;text-align:center}.receiptBox input{display:block;width:100%;padding:10px;background:#09111b;color:#fff;border:1px solid var(--line);border-radius:9px}.receiptPreview{display:block;max-width:100%;max-height:260px;margin:10px auto;border-radius:10px;border:1px solid var(--line)}.addressRow{display:flex;gap:8px}.addressRow input{flex:1}.small{font-size:12px}.priceLine{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.tradeOverlay{position:fixed;inset:0;z-index:100;background:#070b12;overflow:auto;padding:20px}.tradePanel{max-width:620px;margin:24px auto}.countdown{font-size:44px;font-weight:800;text-align:center;margin:20px 0}.resultWin{border:1px solid #14532d}.resultLoss{border:1px solid #7f1d1d}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.rounds{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.rounds{grid-template-columns:1fr}.side{width:230px}.main{padding:16px 11px}.addressRow{flex-direction:column}.tradeOverlay{padding:12px}.tradePanel{margin:8px auto}}.homeActions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.homeAction{width:100%;text-align:left;cursor:pointer;color:inherit}.homeAction:active{transform:scale(.99)}.homeDeposit{font-size:27px;font-weight:800}@media(max-width:520px){.homeActions{gap:10px}}/* direct-home-fix */</style></head><body><div id="auth" class="auth card hidden"><h1 id="authTitle">Sign In</h1><div class="form"><input id="name" placeholder="Full name" class="hidden"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><input id="pin" inputmode="numeric" maxlength="4" placeholder="Recovery PIN (signup)" class="hidden"><input id="ref" placeholder="Referral code (optional)" class="hidden"><button class="btn primary" onclick="submitAuth()">Continue</button><button class="btn" onclick="toggleAuth()" id="switch">Create Account</button><p id="msg" class="muted"></p></div></div><div id="app" class="hidden"><div class="bar"><button class="btn" onclick="toggleMenu()">☰</button><strong style="margin-left:10px">CryptoTrade</strong><span id="balanceTop" class="muted" style="margin-left:auto"></span></div><aside id="side" class="side"><button onclick="page('home',this)">Home</button><button onclick="page('markets',this)">Markets</button><button onclick="page('wallet',this)">Wallet</button><button onclick="page('deposit',this)">Deposit</button><button onclick="page('withdraw',this)">Withdraw</button><button onclick="page('trading',this)">Trading</button><button onclick="page('profile',this)">Profile</button><button onclick="page('notifications',this)">Notifications</button><button onclick="logout()">Logout</button></aside><main id="main" class="main"></main></div><script>
