name: Fix session cookie parser
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix cookie parser
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('worker.js'); s=p.read_text()
          old="const cookieValue=(r,name)=>r.headers.get('Cookie')?.match(new RegExp('(?:^|;\\s*)'+name.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'=([^;]+)'))?.[1]||null;"
          new="const cookieValue=(r,name)=>r.headers.get('Cookie')?.match(new RegExp('(?:^|;\\\\s*)'+name.replace(/[.*+?^${}()|[\\\\]\\\\]/g,'\\\\$&')+'=([^;]+)'))?.[1]||null;"
          if old not in s: raise SystemExit('cookie parser pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check worker.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js
          git diff --cached --check
          git commit -m 'Fix cookie parser syntax'
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix-cookie-regex.yml
          git commit -m 'Remove one-time cookie fix workflow'
          git push