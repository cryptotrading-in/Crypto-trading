name: Deploy Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply approved referral implementation
        if: ${{ !contains(github.event.head_commit.message, 'Complete deposit-qualified referral system') }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          wf=Path('.github/workflows/final-referral-fix.yml').read_text()
          m=re.search(r"python3 <<'PY'\n(.*?)\n          PY",wf,re.S)
          if not m: raise SystemExit('Referral patch payload not found')
          lines=m.group(1).splitlines()
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script,'referral-patch','exec'),{})
          PY
      - name: Validate referral implementation
        if: ${{ !contains(github.event.head_commit.message, 'Complete deposit-qualified referral system') }}
        run: |
          node --check worker.js
          node --check navigation.js
          grep -q "page('referrals',this)" client.html
          grep -q "page('referrals',this)" admin.html
          grep -q 'async function referralData' worker.js
          grep -q 'referralFromUrl' signup.html
      - name: Commit referral implementation
        if: ${{ !contains(github.event.head_commit.message, 'Complete deposit-qualified referral system') }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker.js navigation.js client.html admin.html signup.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Complete deposit-qualified referral system'
          git push
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply crypto-trading-db --remote
      - name: Deploy Worker + assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy