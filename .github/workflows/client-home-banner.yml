name: Add compact client home banner
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add compact banner to client Home
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('client.html')
          s=p.read_text()
          old=".homeActions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}"
          new=".homeHero{position:relative;overflow:hidden;margin:0 0 13px;padding:20px 22px;border:1px solid #24364a;border-radius:17px;background:linear-gradient(135deg,#10263a 0%,#0c1724 52%,#101827 100%);box-shadow:0 14px 40px #0004}.homeHero:before{content:'';position:absolute;width:150px;height:150px;right:-45px;top:-65px;border-radius:50%;background:#0ea5e955;filter:blur(2px)}.homeHero:after{content:'';position:absolute;width:90px;height:90px;left:48%;bottom:-55px;border-radius:50%;background:#22c55e22}.homeHero>*{position:relative;z-index:1}.homeHeroKicker{font-size:11px;font-weight:800;letter-spacing:.12em;color:#38bdf8}.homeHeroTitle{margin:5px 0 3px;font-size:22px;font-weight:850;line-height:1.15}.homeHeroText{margin:0;color:#aeb9c8;font-size:12px}.homeActions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}"
          if old not in s: raise SystemExit('banner CSS anchor not found')
          s=s.replace(old,new,1)
          old2="<h1>Welcome, '+esc(s.user.full_name)+'</h1><div class=\"homeActions\">"
          new2="<h1>Welcome, '+esc(s.user.full_name)+'</h1><div class=\"homeHero\"><div class=\"homeHeroKicker\">CRYPTO TRADE</div><div class=\"homeHeroTitle\">Trade smarter. Stay in control.</div><p class=\"homeHeroText\">Your wallet, rounds and trading activity — all in one secure dashboard.</p></div><div class=\"homeActions\">"
          if old2 not in s: raise SystemExit('banner HTML anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit and remove bootstrap workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client.html .github/workflows/client-home-banner.yml
          git commit -m 'Add compact premium client home banner'
          git rm .github/workflows/client-home-banner.yml
          git commit -m 'Remove one-time banner workflow'
          git push
