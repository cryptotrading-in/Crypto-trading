name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check worker.js
      - name: Check HTML scripts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          for (const file of ['index.html','signup.html','client.html','admin.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script[^>]*>([\\s\\S]*?)<\\/script>/gi)].map(m => m[1]);
            if (!scripts.length) throw new Error(`${file}: no script block found`);
            scripts.forEach((src, i) => {
              const tmp = `/tmp/${file.replace(/[^a-z0-9]/gi,'_')}.${i}.js`;
              fs.writeFileSync(tmp, src);
              execFileSync(process.execPath, ['--check', tmp], {stdio:'inherit'});
            });
          }
          console.log('All HTML script blocks passed syntax checks.');
          NODE
