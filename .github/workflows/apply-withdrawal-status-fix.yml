name: Apply withdrawal status fix
on:
  push:
    branches:
      - fix/withdrawal-status-reserved
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/withdrawal-status-reserved
      - name: Patch withdrawal flow
        run: |
          python3 <<'PY'
          from pathlib import Path

          worker = Path('worker.js')
          s = worker.read_text()

          old_me = "const u=await e.DB.prepare('SELECT id,email,full_name,phone,country,referral_code,referred_by,account_status,created_at FROM users WHERE id=?').bind(s.user_id).first(),w=await e.DB.prepare('SELECT * FROM wallets WHERE user_id=?').bind(s.user_id).first(),p=await e.DB.prepare('SELECT withdrawal_address FROM profiles WHERE user_id=?').bind(s.user_id).first(),rs=await e.DB.prepare('SELECT r.*,c.starts_at cycle_start,c.ends_at cycle_end FROM trading_rounds r JOIN trading_cycles c ON c.id=r.cycle_id WHERE c.ends_at>? ORDER BY r.round_no').bind(now()).all(),th=[5000,10000,15000,20000,25000];return ok({user:u,wallet:{available:fmt(w?.available_minor),reserved:fmt(w?.reserved_minor)},withdrawalAddress:p?.withdrawal_address||'',rounds:(rs.results||[]).map(x=>({...x,profit_pct:Number(x.profit_bps)/100,fee_pct:Number(x.fee_bps)/100,threshold_minor:th[x.round_no-1],unlocked:Number(w?.available_minor||0)>=th[x.round_no-1]}))})"
          new_me = "const u=await e.DB.prepare('SELECT id,email,full_name,phone,country,referral_code,referred_by,account_status,created_at FROM users WHERE id=?').bind(s.user_id).first(),w=await e.DB.prepare('SELECT * FROM wallets WHERE user_id=?').bind(s.user_id).first(),p=await e.DB.prepare('SELECT withdrawal_address FROM profiles WHERE user_id=?').bind(s.user_id).first(),rs=await e.DB.prepare('SELECT r.*,c.starts_at cycle_start,c.ends_at cycle_end FROM trading_rounds r JOIN trading_cycles c ON c.id=r.cycle_id WHERE c.ends_at>? ORDER BY r.round_no').bind(now()).all(),ws=await e.DB.prepare(\"SELECT id,amount_minor,address,status,requested_at,completed_at FROM withdrawals WHERE user_id=? ORDER BY requested_at DESC LIMIT 100\").bind(s.user_id).all(),th=[5000,10000,15000,20000,25000],withdrawalActive=(ws.results||[]).filter(x=>['pending','approved','processing'].includes(x.status)).reduce((n,x)=>n+Number(x.amount_minor||0),0);return ok({user:u,wallet:{available:fmt(w?.available_minor),reserved:fmt(w?.reserved_minor),withdrawal:fmt(withdrawalActive)},withdrawals:ws.results||[],withdrawalAddress:p?.withdrawal_address||'',rounds:(rs.results||[]).map(x=>({...x,profit_pct:Number(x.profit_bps)/100,fee_pct:Number(x.fee_bps)/100,threshold_minor:th[x.round_no-1],unlocked:Number(w?.available_minor||0)>=th[x.round_no-1]}))})"
          if old_me not in s:
              raise SystemExit('Expected /me code was not found; aborting.')
          s = s.replace(old_me, new_me, 1)

          old_status = "async function withdrawalStatus(r,e){const s=await admin(r,e),b=await body(r),w=await e.DB.prepare('SELECT * FROM withdrawals WHERE id=?').bind(b.id).first();if(!w)return fail('Withdrawal not found.',404);if(!['approved','processing','completed','rejected'].includes(b.status))return fail('Invalid status.');if(b.status==='rejected'&&w.status!=='rejected'&&w.status!=='completed'){const x=await e.DB.prepare('UPDATE wallets SET available_minor=available_minor+?,reserved_minor=reserved_minor-?,updated_at=? WHERE user_id=? AND reserved_minor>=?').bind(w.amount_minor,w.amount_minor,now(),w.user_id,w.amount_minor).run();if(Number(x.meta?.changes||0)!==1)return fail('Wallet reservation could not be released.',409);const nw=await e.DB.prepare('SELECT * FROM wallets WHERE user_id=?').bind(w.user_id).first();await e.DB.prepare('INSERT INTO wallet_transactions(id,user_id,type,amount_minor,available_after_minor,reserved_after_minor,reference_type,reference_id,reason) VALUES(?,?,?,?,?,?,?,?,?)').bind(id(),w.user_id,'withdrawal_release',w.amount_minor,nw.available_minor,nw.reserved_minor,'withdrawal',w.id,'Rejected withdrawal release').run()}await e.DB.prepare('UPDATE withdrawals SET status=?,completed_at=? WHERE id=?').bind(b.status,b.status==='completed'?now():null,w.id).run();await e.DB.prepare('INSERT INTO notifications(id,user_id,type,title,body) VALUES(?,?,?,?,?)').bind(id(),w.user_id,'withdrawal','Withdrawal update',`Your withdrawal status is now ${b.status}.`).run();return ok({status:b.status})}"
          new_status = "async function withdrawalStatus(r,e){const s=await admin(r,e),b=await body(r),w=await e.DB.prepare('SELECT * FROM withdrawals WHERE id=?').bind(b.id).first();if(!w)return fail('Withdrawal not found.',404);if(!['approved','processing','completed','rejected'].includes(b.status))return fail('Invalid status.');const activeStatuses=['pending','approved','processing'];if(b.status==='rejected'&&activeStatuses.includes(w.status)){const x=await e.DB.prepare('UPDATE wallets SET available_minor=available_minor+?,reserved_minor=reserved_minor-?,updated_at=? WHERE user_id=? AND reserved_minor>=?').bind(w.amount_minor,w.amount_minor,now(),w.user_id,w.amount_minor).run();if(Number(x.meta?.changes||0)!==1)return fail('Wallet reservation could not be released.',409);const nw=await e.DB.prepare('SELECT * FROM wallets WHERE user_id=?').bind(w.user_id).first();await e.DB.prepare('INSERT INTO wallet_transactions(id,user_id,type,amount_minor,available_after_minor,reserved_after_minor,reference_type,reference_id,reason) VALUES(?,?,?,?,?,?,?,?,?)').bind(id(),w.user_id,'withdrawal_release',w.amount_minor,nw.available_minor,nw.reserved_minor,'withdrawal',w.id,'Rejected withdrawal release').run()}if(b.status==='completed'&&activeStatuses.includes(w.status)){const x=await e.DB.prepare('UPDATE wallets SET reserved_minor=reserved_minor-?,updated_at=? WHERE user_id=? AND reserved_minor>=?').bind(w.amount_minor,now(),w.user_id,w.amount_minor).run();if(Number(x.meta?.changes||0)!==1)return fail('Wallet withdrawal reservation could not be released.',409);const nw=await e.DB.prepare('SELECT * FROM wallets WHERE user_id=?').bind(w.user_id).first();await e.DB.prepare('INSERT INTO wallet_transactions(id,user_id,type,amount_minor,available_after_minor,reserved_after_minor,reference_type,reference_id,reason) VALUES(?,?,?,?,?,?,?,?,?)').bind(id(),w.user_id,'withdrawal_complete',0,nw.available_minor,nw.reserved_minor,'withdrawal',w.id,'Completed withdrawal reservation released').run()}await e.DB.prepare('UPDATE withdrawals SET status=?,completed_at=? WHERE id=?').bind(b.status,b.status==='completed'?now():null,w.id).run();await e.DB.prepare('INSERT INTO notifications(id,user_id,type,title,body) VALUES(?,?,?,?,?)').bind(id(),w.user_id,'withdrawal','Withdrawal update',`Your withdrawal status is now ${b.status}.`).run();return ok({status:b.status})}"
          if old_status not in s:
              raise SystemExit('Expected withdrawalStatus code was not found; aborting.')
          s = s.replace(old_status, new_status, 1)
          worker.write_text(s)

          client = Path('client.html')
          c = client.read_text()
          replacements = [
            ("<span class=\"muted\">Reserved</span><div class=\"num\">'+money(s.wallet.reserved)+' USDT</div>", "<span class=\"muted\">Withdrawal</span><div class=\"num\">'+money(s.wallet.withdrawal)+' USDT</div>"),
            ("<span class=\"muted\">Reserved</span><div class=\"num\">'+money(state.wallet.reserved)+' USDT</div>", "<span class=\"muted\">Withdrawal</span><div class=\"num\">'+money(state.wallet.withdrawal)+' USDT</div>"),
            ("async function withdraw(){await refresh();$('main').innerHTML='<h1>Withdraw</h1><div class=\"card form\"><p class=\"muted\">Minimum withdrawal is controlled by Admin Settings. Funds are reserved immediately.</p><input value=\"'+esc(state.withdrawalAddress||'')+'\" placeholder=\"Set address in Wallet Settings\" readonly><input id=\"wa\" type=\"number\" min=\"0.01\" placeholder=\"Amount USDT\"><input id=\"wp\" type=\"password\" inputmode=\"numeric\" maxlength=\"4\" placeholder=\"4-digit withdrawal PIN\"><button class=\"btn primary\" onclick=\"sendWithdrawal()\">Submit Withdrawal</button><p id=\"out\" class=\"muted\"></p></div>'}", "async function withdraw(){await refresh();const rows=state.withdrawals||[];const statusClass=s=>s==='completed'?'green':(s==='rejected'?'amber':'muted');$('main').innerHTML='<h1>Withdraw</h1><div class=\"card form\"><div class=\"priceLine\"><span>Withdrawal</span><b>'+money(state.wallet.withdrawal)+' USDT</b></div><p class=\"muted\">Minimum withdrawal is controlled by Admin Settings. Funds move to Withdrawal immediately when you submit.</p><input value=\"'+esc(state.withdrawalAddress||'')+'\" placeholder=\"Set address in Wallet Settings\" readonly><input id=\"wa\" type=\"number\" min=\"0.01\" placeholder=\"Amount USDT\"><input id=\"wp\" type=\"password\" inputmode=\"numeric\" maxlength=\"4\" placeholder=\"4-digit withdrawal PIN\"><button class=\"btn primary\" onclick=\"sendWithdrawal()\">Submit Withdrawal</button><p id=\"out\" class=\"muted\"></p></div><h2>Withdrawal History</h2><div class=\"card\">'+(rows.length?rows.map(x=>'<div class=\"priceLine\"><span>'+money(Number(x.amount_minor||0)/100)+' USDT</span><span><b class=\"'+statusClass(x.status)+'\">'+esc(String(x.status||'').toUpperCase())+'</b><br><small class=\"muted\">'+date(x.requested_at)+(x.completed_at?' · Completed '+date(x.completed_at):'')+'</small></span></div>').join(''):'<p class=\"muted\">No withdrawals yet.</p>')+'</div>'}")
            ("async function sendWithdrawal(){try{const d=await api('/withdrawal',{method:'POST',body:JSON.stringify({amount:$('wa').value,pin:$('wp').value})});$('out').textContent='Submitted: '+d.withdrawalId;await refresh()}catch(e){$('out').textContent=e.message}}", "async function sendWithdrawal(){try{const d=await api('/withdrawal',{method:'POST',body:JSON.stringify({amount:$('wa').value,pin:$('wp').value})});$('out').textContent='Submitted: '+d.withdrawalId+' · Status: '+String(d.status||'pending').toUpperCase();await withdraw()}catch(e){$('out').textContent=e.message}}")
          ]
          for old,new in replacements:
              if old not in c:
                  raise SystemExit('Expected client code was not found; aborting.')
              c = c.replace(old,new,1)
          client.write_text(c)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-withdrawal-status-fix.yml
          git add worker.js client.html .github/workflows/apply-withdrawal-status-fix.yml
          git commit -m "Fix withdrawal completion reservation and client status"
          git push origin fix/withdrawal-status-reserved
