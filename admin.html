<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoTrade Admin</title><style>
:root{--bg:#070b12;--panel:#0d131d;--line:#1d2938;--text:#f5f7fb;--muted:#8d9aac;--blue:#38bdf8;--green:#22c55e;--red:#ef4444;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}.bar{height:64px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:15px;padding:0 18px;background:#080d15ee;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}button,input,select,textarea{font:inherit}.btn{border:1px solid var(--line);background:#111a26;color:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.primary{background:#0ea5e9;border-color:#0ea5e9}.menu{position:fixed;z-index:10;top:64px;left:0;bottom:0;width:270px;padding:14px;background:#090f17;border-right:1px solid var(--line);transform:translateX(-105%);transition:.28s}.menu.open{transform:none}.menu button{width:100%;display:block;text-align:left;background:none;border:0;color:var(--muted);padding:12px;border-radius:9px;cursor:pointer}.menu button:hover,.menu button.active{background:#14202e;color:#fff}.main{max-width:1200px;margin:auto;padding:24px 18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}.num{font-size:28px;font-weight:800;margin-top:6px}.muted{color:var(--muted)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#172334;font-size:11px}.form{display:grid;gap:11px;max-width:680px}.form input,.form select,.form textarea{width:100%;padding:11px;background:#09111b;border:1px solid var(--line);border-radius:9px;color:#fff}.hidden{display:none!important}.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.round h3{margin:0 0 10px}.notice{padding:11px;border:1px solid #5b4310;background:#241b08;color:#fbbf24;border-radius:9px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.rounds{grid-template-columns:1fr 1fr}}@media(max-width:500px){.main{padding:16px 12px}.grid,.rounds{grid-template-columns:1fr}.menu{width:250px}}
</style></head><body>
<div class="bar"><button class="btn" onclick="toggleMenu()">☰</button><strong>CryptoTrade Admin</strong><span class="muted" id="status">Not signed in</span><button class="btn" style="margin-left:auto" onclick="logout()">Logout</button></div>
<aside id="menu" class="menu"><button onclick="page('dashboard',this)">Dashboard</button><button onclick="page('users',this)">Users / Clients</button><button onclick="page('deposits',this)">Deposits</button><button onclick="page('withdrawals',this)">Withdrawals</button><button onclick="page('wallet',this)">Wallet Management</button><button onclick="page('rounds',this)">Trading · Round Manager</button><button onclick="page('settings',this)">Admin Settings</button></aside>
<main id="main" class="main"></main>
<script>
const $=x=>document.getElementById(x), api=async(path,opt={})=>{const r=await fetch('/api'+path,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'Request failed');return d};
function toggleMenu(){$('menu').classList.toggle('open')}function closeMenu(){$('menu').classList.remove('open')}
async function boot(){try{const d=await api('/admin/me');$('status').textContent='Signed in: '+(d.admin?.username||d.admin?.email||'Admin');page('dashboard')}catch{login()}}
function login(){ $('main').innerHTML='<div style="max-width:430px;margin:70px auto" class="card"><h1>Admin Login</h1><p class="muted">Use your administrator username/email and password.</p><div class="form"><input id="identifier" placeholder="Username or email"><input id="password" type="password" placeholder="Password"><button class="btn primary" onclick="doLogin()">Sign In</button></div><p id="msg" class="muted"></p></div>'}
async function doLogin(){try{const d=await api('/admin/login',{method:'POST',body:JSON.stringify({identifier:$('identifier').value,password:$('password').value})});if(d.sessionCookie)document.cookie=d.sessionCookie;location.reload()}catch(e){$('msg').textContent=e.message}}
function page(p,el){closeMenu();document.querySelectorAll('#menu button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');({dashboard:dashboard,users:users,deposits:deposits,withdrawals:withdrawals,wallet:wallet,rounds:rounds,settings:settings}[p]||dashboard)()}
async function dashboard(){try{const d=await api('/admin/summary');$('main').innerHTML='<h1>Dashboard</h1><div class="grid"><div class="card">Clients<div class="num">'+d.summary.clients+'</div></div><div class="card">Pending deposits<div class="num">'+d.summary.pendingDeposits+'</div></div><div class="card">Pending withdrawals<div class="num">'+d.summary.pendingWithdrawals+'</div></div><div class="card">Trades<div class="num">'+d.summary.trades+'</div></div></div><div class="card" style="margin-top:16px"><h3>Platform controls</h3><p class="muted">Use the menu to review wallet activity and edit the five trading rounds.</p></div>'}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}
async function users(){try{const d=await api('/admin/users');$('main').innerHTML='<h1>Users / Clients</h1><div class="tablewrap"><table class="table"><tr><th>Client</th><th>Email</th><th>Balance</th><th>Reserved</th><th>Withdrawal Address</th><th>Status</th><th>Date</th></tr>'+d.rows.map(x=>'<tr><td>'+esc(x.full_name)+'</td><td>'+esc(x.email)+'</td><td>'+fmt(x.available_minor)+'</td><td>'+fmt(x.reserved_minor)+'</td><td>'+esc(x.withdrawal_address||'—')+'</td><td><span class="pill">'+x.account_status+'</span></td><td>'+date(x.created_at)+'</td></tr>').join('')+'</table></div>'}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}
async function deposits(){try{const d=await api('/admin/deposits');$('main').innerHTML='<h1>Deposits</h1><div class="tablewrap"><table class="table"><tr><th>Client</th><th>Amount</th><th>Network</th><th>TXID</th><th>Date</th><th>Status</th><th>Action</th></tr>'+d.rows.map(x=>'<tr><td>'+esc(x.full_name)+'</td><td>'+fmt(x.amount_minor)+'</td><td>'+x.network+'</td><td title="'+esc(x.txid)+'">'+esc((x.txid||'').slice(0,18))+'</td><td>'+date(x.submitted_at)+'</td><td>'+x.status+'</td><td>'+(x.status!=='approved'&&x.status!=='rejected'?'<button class="btn primary" onclick="reviewDeposit(\''+x.id+'\',\'approved\')">Approve</button> <button class="btn" onclick="reviewDeposit(\''+x.id+'\',\'rejected\')">Reject</button>':'—')+'</td></tr>').join('')+'</table></div>'}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}
async function reviewDeposit(id,status){try{await api('/admin/deposit/review',{method:'POST',body:JSON.stringify({id,status})});deposits()}catch(e){alert(e.message)}}
async function withdrawals(){try{const d=await api('/admin/withdrawals');$('main').innerHTML='<h1>Withdrawals</h1><div class="tablewrap"><table class="table"><tr><th>Client</th><th>Amount</th><th>TRC20 Address</th><th>Date</th><th>Status</th><th>Action</th></tr>'+d.rows.map(x=>'<tr><td>'+esc(x.full_name)+'</td><td>'+fmt(x.amount_minor)+'</td><td>'+esc(x.address||'—')+' <button class="btn" onclick="navigator.clipboard.writeText('+JSON.stringify(x.address||'')+')">Copy</button></td><td>'+date(x.requested_at)+'</td><td>'+x.status+'</td><td><select onchange="withdrawStatus(\''+x.id+'\',this.value)"><option>'+x.status+'</option><option>approved</option><option>processing</option><option>completed</option><option>rejected</option></select></td></tr>').join('')+'</table></div>'}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}
async function withdrawStatus(id,status){try{await api('/admin/withdrawal/status',{method:'POST',body:JSON.stringify({id,status})});withdrawals()}catch(e){alert(e.message)}}
function wallet(){ $('main').innerHTML='<h1>Wallet Management</h1><div class="card"><p class="muted">Server-side wallet adjustments are ledger transactions. Select a client and enter an amount/reason.</p><div class="form"><input id="wid" placeholder="Client ID"><input id="wamount" type="number" step="0.01" placeholder="Amount USDT"><select id="wtype"><option value="credit">Add Balance</option><option value="debit">Deduct Balance</option></select><input id="wreason" placeholder="Reason"><button class="btn primary" onclick="adjustWallet()">Confirm Adjustment</button></div></div>'}
async function adjustWallet(){try{await api('/admin/wallet/adjust',{method:'POST',body:JSON.stringify({userId:$('wid').value,amount:$('wamount').value,type:$('wtype').value,reason:$('wreason').value})});alert('Ledger adjustment completed.')}catch(e){alert(e.message)}}
async function rounds(){try{const d=await api('/admin/rounds');$('main').innerHTML='<h1>Round Manager</h1><p class="muted">Exactly five rounds. Client-facing action is BUY/SELL. Dates display as DDMMYYYY.</p><div class="rounds">'+d.rows.map((r,i)=>'<div class="card round"><h3>Round '+r.round_no+'</h3><div class="form"><select id="on'+i+'"><option value="1" '+(r.enabled?'selected':'')+'>ON</option><option value="0" '+(!r.enabled?'selected':'')+'>OFF</option></select><input id="asset'+i+'" value="'+esc(r.asset||'BTC/USDT')+'" placeholder="Asset"><select id="act'+i+'"><option '+(r.action==='BUY'?'selected':'')+'>BUY</option><option '+(r.action==='SELL'?'selected':'')+'>SELL</option></select><input id="date'+i+'" type="date" value="'+(r.start_date||'')+'"><input id="time'+i+'" type="time" value="'+(r.start_time||'')+'"><input id="dur'+i+'" type="number" value="'+(r.duration_seconds||300)+'" placeholder="Duration seconds"><input id="profit'+i+'" type="number" step="0.01" value="'+(r.profit_bps||0)/100+'" placeholder="Profit %"><input id="fee'+i+'" type="number" step="0.01" value="'+(r.fee_bps||0)/100+'" placeholder="Fee %"><textarea id="rules'+i+'" placeholder="Rules">'+esc(r.rules||'')+'</textarea><button class="btn primary" onclick="saveRound('+r.round_no+','+i+')">Save Round</button></div></div>').join('')+'</div>'}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}
async function saveRound(no,i){try{await api('/admin/rounds/save',{method:'POST',body:JSON.stringify({roundNo:no,enabled:$('on'+i).value==='1',asset:$('asset'+i).value,action:$('act'+i).value,startDate:$('date'+i).value,startTime:$('time'+i).value,durationSeconds:Number($('dur'+i).value),profitBps:Math.round(Number($('profit'+i).value)*100),feeBps:Math.round(Number($('fee'+i).value)*100),rules:$('rules'+i).value})});alert('Round '+no+' saved.')}catch(e){alert(e.message)}}
async function settings(){try{const d=await api('/admin/settings');$('main').innerHTML='<h1>Admin Settings</h1><div class="card"><div class="form"><label>TRC20 Deposit Address<input id="trc" value="'+esc(d.settings.trc20_deposit_address||'')+'"></label><label>ERC20 Deposit Address<input id="erc" value="'+esc(d.settings.erc20_deposit_address||'')+'"></label><label>Minimum Deposit USDT<input id="mind" type="number" value="'+fmt(d.settings.minimum_deposit_minor||3000)+'"></label><label>Minimum Withdrawal USDT<input id="minw" type="number" value="'+fmt(d.settings.minimum_withdrawal_minor||1000)+'"></label><label>WhatsApp 1<input id="wa1" value="'+esc(d.settings.whatsapp_1||'')+'"></label><label>WhatsApp 2<input id="wa2" value="'+esc(d.settings.whatsapp_2||'')+'"></label><label>WhatsApp 3<input id="wa3" value="'+esc(d.settings.whatsapp_3||'')+'"></label><button class="btn primary" onclick="saveSettings()">Save Settings</button></div></div>'}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}
async function saveSettings(){try{await api('/admin/settings/save',{method:'POST',body:JSON.stringify({trc20DepositAddress:$('trc').value,erc20DepositAddress:$('erc').value,minimumDeposit:$('mind').value,minimumWithdrawal:$('minw').value,whatsapp1:$('wa1').value,whatsapp2:$('wa2').value,whatsapp3:$('wa3').value})});alert('Settings saved.')}catch(e){alert(e.message)}}
function fmt(x){return (Number(x||0)/100).toFixed(2)}function date(x){if(!x)return'—';let d=new Date(x);return String(d.getUTCDate()).padStart(2,'0')+String(d.getUTCMonth()+1).padStart(2,'0')+d.getUTCFullYear()}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function logout(){fetch('/api/logout',{method:'POST'}).finally(()=>location.reload())}boot();
</script></body></html>
