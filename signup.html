<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account · CryptoTrade</title><style>:root{--bg:#060a10;--panel:#0d131d;--line:#1d2938;--text:#f5f7fb;--muted:#93a0b2;--blue:#38bdf8;--green:#22c55e;--red:#ef4444}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 0,#102b43 0,transparent 38%),var(--bg);color:var(--text);font:15px system-ui,sans-serif}.card{width:min(430px,calc(100% - 24px));background:#0d131df2;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 25px 80px #0007}.brand{font-weight:900;font-size:22px;margin-bottom:6px}.muted{color:var(--muted)}.form{display:grid;gap:11px;margin-top:20px}input{width:100%;padding:12px;background:#09111b;color:#fff;border:1px solid var(--line);border-radius:9px}button,.link{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:#111a26;color:#fff;text-align:center;cursor:pointer;text-decoration:none}.primary{background:var(--blue);border-color:var(--blue);color:#041018;font-weight:800}.msg{min-height:22px}.success{color:var(--green)}.error{color:var(--red)}small{color:var(--muted)}</style></head><body><main class="card"><div class="brand">CryptoTrade</div><h1>Create Account</h1><p class="muted">Create your client account securely.</p><form class="form" id="form"><input id="name" required placeholder="Full name"><input id="email" required type="email" placeholder="Email"><input id="pass" required type="password" minlength="8" placeholder="Password (8+ characters)"><input id="pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="Recovery PIN (optional)"><input id="ref" placeholder="Referral code (optional)"><button class="primary" id="submit" type="submit">Create Account</button><a class="link" href="client.html">Already have an account? Sign In</a><p id="msg" class="msg muted"></p></form><small>Your password is processed by the platform's server-side authentication system.</small></main><script>const $=id=>document.getElementById(id);$('form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;$('msg').className='msg muted';$('msg').textContent='Creating account…';try{const recoveryPin=$('pin').value.trim();if(recoveryPin&&!/^\d{4}$/.test(recoveryPin))throw Error('Recovery PIN must be exactly 4 digits.');const r=await fetch('/api/signup',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({fullName:$('name').value.trim(),email:$('email').value.trim(),password:$('pass').value,recoveryPin,referralCode:$('ref').value.trim()})});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'Signup failed.');$('msg').className='msg success';$('msg').textContent='Account created successfully. Opening client…';setTimeout(()=>location.href='client.html',350)}catch(err){$('msg').className='msg error';$('msg').textContent=err.message;$('submit').disabled=false}});</script></body></html>
