name: Fix referral card click
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add referral card click
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('client.html')
          s=p.read_text()
          old="<button type=\"button\" class=\"card homeAction\" onclick=\"page('trading')\"><span class=\"muted\">Rounds</span><div class=\"num\">5</div></button></div>'}"
          new="<button type=\"button\" class=\"card homeAction\" onclick=\"page('trading')\"><span class=\"muted\">Rounds</span><div class=\"num\">5</div></button><button type=\"button\" class=\"card homeAction\" onclick=\"page('referrals')\"><span class=\"muted\">Refer & Earn</span><div class=\"num\">Refer</div></button></div>'}"
          if old not in s:
              raise SystemExit('Expected home referral insertion point not found; no change made.')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client.html
          git commit -m 'Make referral card clickable' || exit 0
          git push
