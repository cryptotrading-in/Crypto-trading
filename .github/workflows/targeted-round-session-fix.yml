name: Targeted round timing and session isolation fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch only round timing and session isolation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          old="async function client(r,e){const s=await sess(r,e,'ct_client_session','ct_session');if(!s?.user_id)throw Error('AUTH_REQUIRED');return s}\nasync function admin(r,e){const s=await sess(r,e,'ct_admin_session','ct_session');if(!s?.admin_id)throw Error('ADMIN_REQUIRED');return s}"
          new="async function client(r,e){let s=await sess(r,e,'ct_client_session');if(!s?.user_id)s=await sess(r,e,'ct_session');if(!s?.user_id)throw Error('AUTH_REQUIRED');return s}\nasync function admin(r,e){let s=await sess(r,e,'ct_admin_session');if(!s?.admin_id)s=await sess(r,e,'ct_session');if(!s?.admin_id)throw Error('ADMIN_REQUIRED');return s}"
          if old not in s: raise SystemExit('session wrapper pattern not found')
          s=s.replace(old,new,1)
          old="const startMs=new Date(round.start_at).getTime(),endMs=new Date(round.cycle_end).getTime(),nm=Date.now();"
          new="const startMs=new Date(round.start_at).getTime(),endMs=startMs+60000,nm=Date.now();"
          if old not in s: raise SystemExit('trade window pattern not found')
          s=s.replace(old,new,1)
          old="const start=(b.startDate&&b.startTime)?new Date(`${b.startDate}T${b.startTime}:00Z`).toISOString():cur.start_at;"
          new="const start=(b.startDate&&b.startTime)?new Date(`${b.startDate}T${b.startTime}:00+05:00`).toISOString():cur.start_at;"
          if old not in s: raise SystemExit('save round timezone pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('client.html')
          s=p.read_text()
          old="const t=new Date(r.start_at).getTime(),e=new Date(r.cycle_end).getTime(),n=Date.now(),live=r.enabled&&Number.isFinite(t)&&Number.isFinite(e)&&n>=t&&n<=e;"
          new="const t=new Date(r.start_at).getTime(),e=t+60000,n=Date.now(),live=r.enabled&&Number.isFinite(t)&&n>=t&&n<=e;"
          if old not in s: raise SystemExit('client round timing pattern not found')
          s=s.replace(old,new,1)
          old="'Start: '+date(r.start_at)+' · Entry: '+(live?'OPEN NOW':'scheduled')"
          new="'Start: '+date(r.start_at)+' · Entry: '+(live?'OPEN NOW':Date.now()<new Date(r.start_at).getTime()?'SCHEDULED':'CLOSED')"
          if old not in s: raise SystemExit('client round label pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js client.html
          git diff --cached --check
          git commit -m "Fix round start timezone window and session isolation"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/targeted-round-session-fix.yml
          git commit -m "Remove one-time round session fix workflow"
          git push
