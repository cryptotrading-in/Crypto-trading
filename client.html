<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoTrade Client</title><style>body{margin:0;background:#070b12;color:#f5f7fb;font:14px system-ui}.bar{height:62px;display:flex;align-items:center;padding:0 15px;border-bottom:1px solid #1d2938;position:sticky;top:0;background:#080d15ee;backdrop-filter:blur(14px)}button,input,select,textarea{font:inherit}.btn{padding:10px 13px;border:1px solid #1d2938;border-radius:9px;background:#111a26;color:#fff}.primary{background:#0ea5e9;border-color:#0ea5e9}.side{position:fixed;top:62px;bottom:0;left:0;width:250px;background:#090f17;border-right:1px solid #1d2938;padding:14px;transform:translateX(-105%);transition:.28s;z-index:5}.side.open{transform:none}.side button{width:100%;display:block;text-align:left;padding:12px;border:0;background:none;color:#8d9aac;border-radius:9px}.side button.active{background:#14202e;color:#fff}.main{max-width:1100px;margin:auto;padding:24px 15px}.card{background:#0d131d;border:1px solid #1d2938;border-radius:15px;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.num{font-size:27px;font-weight:800}.muted{color:#8d9aac}.amber{color:#f59e0b}.form{display:grid;gap:11px;max-width:620px}.form input,.form select,.form textarea{padding:11px;background:#09111b;color:#fff;border:1px solid #1d2938;border-radius:9px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #1d2938;text-align:left}.scroll{overflow:auto}.auth{max-width:420px;margin:70px auto}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.rounds{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid,.rounds{grid-template-columns:1fr}.side{width:235px}}</style></head><body><div id="auth" class="auth card"><h1 id="authTitle">Sign In</h1><div class="form"><input id="name" placeholder="Full name" class="hidden"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><input id="pin" inputmode="numeric" maxlength="4" placeholder="Recovery PIN (signup)" class="hidden"><button class="btn primary" onclick="submitAuth()">Continue</button><button class="btn" onclick="toggleAuth()" id="switch">Create Account</button><p id="msg" class="muted"></p></div></div><div id="app" class="hidden"><div class="bar"><button class="btn" onclick="toggleMenu()">☰</button><strong style="margin-left:10px">CryptoTrade</strong><span id="balanceTop" class="muted" style="margin-left:auto"></span></div><aside id="side" class="side"><button onclick="page('home',this)">Home</button><button onclick="page('markets',this)">Markets</button><button onclick="page('wallet',this)">Wallet</button><button onclick="page('deposit',this)">Deposit</button><button onclick="page('withdraw',this)">Withdraw</button><button onclick="page('trading',this)">Trading</button><button onclick="page('profile',this)">Profile</button><button onclick="page('notifications',this)">Notifications</button><button onclick="logout()">Logout</button></aside><main id="main" class="main"></main></div><script>const $=x=>document.getElementById(x),api=async(p,o={})=>{const r=await fetch('/api'+p,{headers:{'content-type':'application/json'},...o});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'Request failed');return d};let signup=false,state=null;function toggleAuth(){signup=!signup;$('authTitle').textContent=signup?'Create Account':'Sign In';$('name').classList.toggle('hidden',!signup);$('pin').classList.toggle('hidden',!signup);$('switch').textContent=signup?'Sign In':'Create Account';$('msg').textContent=''}async function submitAuth(){try{const b={email:$('email').value,password:$('pass').value};if(signup){b.fullName=$('name').value;b.recoveryPin=$('pin').value}const d=await api(signup?'/signup':'/login',{method:'POST',body:JSON.stringify(b)});if(d.sessionCookie){document.cookie=d.sessionCookie}await start()}catch(e){$('msg').textContent=e.message}}async function start(){try{state=await api('/me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');renderHome()}catch{}}async function refresh(){state=await api('/me');$('balanceTop').textContent=state.wallet.available+' USDT';return state}function toggleMenu(){$('side').classList.toggle('open')}function closeMenu(){$('side').classList.remove('open')}function page(p,el){closeMenu();document.querySelectorAll('#side button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');if(p==='home')renderHome();if(p==='markets')markets();if(p==='wallet')wallet();if(p==='deposit')deposit();if(p==='withdraw')withdraw();if(p==='trading')trading();if(p==='profile')profile();if(p==='notifications')notifications()}function renderHome(){refresh().then(s=>{$('main').innerHTML='<h1>Welcome, '+esc(s.user.full_name)+'</h1><div class="grid"><div class="card"><span class="muted">Available</span><div class="num">'+s.wallet.available+' USDT</div></div><div class="card"><span class="muted">Reserved</span><div class="num">'+s.wallet.reserved+' USDT</div></div><div class="card"><span class="muted">Account</span><div class="num">Active</div></div><div class="card"><span class="muted">Rounds</span><div class="num">5</div></div></div><h2>Trading Rounds</h2><div class="rounds">'+s.rounds.map(r=>'<div class="card"><span class="amber">'+(r.unlocked?'UNLOCKED':'🔒 LOCKED')+'</span><h3>Round '+r.round_no+'</h3><p class="muted">Unlock at '+(r.threshold_minor/100).toFixed(0)+' USDT</p><p>'+esc(r.asset)+' · '+esc(r.action)+'</p>'+(r.unlocked?'<button class="btn primary" onclick="page(\'trading\')">Open Trading</button>':'<button class="btn" onclick="page(\'deposit\')">Deposit to Unlock</button>')+'</div>').join('')+'</div>'})}function markets(){$('main').innerHTML='<h1>Markets</h1><p class="muted">External live-market data is separate from platform-defined trading rounds.</p><div class="grid"><div class="card"><h3>BTC/USDT</h3><p>Live provider connection slot</p></div><div class="card"><h3>ETH/USDT</h3><p>Live provider connection slot</p></div><div class="card"><h3>SOL/USDT</h3><p>Live provider connection slot</p></div><div class="card"><h3>ZEC/USDT</h3><p>Live provider connection slot</p></div></div>'}function wallet(){$('main').innerHTML='<h1>Wallet</h1><div class="card"><h2>'+state.wallet.available+' USDT</h2><p class="muted">Available balance</p><p>Reserved: '+state.wallet.reserved+' USDT</p><button class="btn primary" onclick="page(\'deposit\')">Deposit</button> <button class="btn" onclick="page(\'withdraw\')">Withdraw</button></div>'}function deposit(){$('main').innerHTML='<h1>Deposit</h1><p class="muted">TRC20 preferred · ERC20 supported · Minimum 30 USDT</p><div class="card form"><select id="network"><option>TRC20</option><option>ERC20</option></select><input id="da" placeholder="Deposit address shown by admin"><input id="amount" type="number" min="30" placeholder="Amount USDT"><input id="txid" placeholder="TXID / Hash"><button class="btn primary" onclick="sendDeposit()">Submit Deposit</button><p id="out" class="muted"></p></div>'}async function sendDeposit(){try{const d=await api('/deposit',{method:'POST',body:JSON.stringify({network:$('network').value,amount:$('amount').value,txid:$('txid').value})});$('out').textContent='Submitted: '+d.depositId}catch(e){$('out').textContent=e.message}}function withdraw(){$('main').innerHTML='<h1>Withdraw</h1><p class="muted">Minimum withdrawal is controlled by Admin Settings.</p><div class="card form"><input value="'+esc(state.withdrawalAddress||'')+'" placeholder="Withdrawal address" readonly><input id="wa" type="number" placeholder="Amount USDT"><input id="wp" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit withdrawal PIN"><button class="btn primary" onclick="sendWithdrawal()">Submit Withdrawal</button><p id="out" class="muted"></p></div>'}async function sendWithdrawal(){try{const d=await api('/withdrawal',{method:'POST',body:JSON.stringify({amount:$('wa').value,pin:$('wp').value})});$('out').textContent='Submitted: '+d.withdrawalId;await refresh()}catch(e){$('out').textContent=e.message}}function trading(){refresh().then(s=>{$('main').innerHTML='<h1>Trading</h1><p class="muted">Five rounds per 24-hour cycle. Entry window is controlled by round settings.</p><div class="rounds">'+s.rounds.map(r=>'<div class="card"><span class="amber">'+(r.unlocked?'OPEN FOR ELIGIBLE BALANCE':'LOCKED')+'</span><h3>Round '+r.round_no+'</h3><p>'+esc(r.asset)+' · '+esc(r.action)+'</p><p>Duration: '+r.duration_seconds+' sec</p>'+(r.unlocked?'<button class="btn primary">View Round</button>':'<button class="btn" onclick="page(\'deposit\')">Deposit to Unlock</button>')+'</div>').join('')+'</div>'})}function profile(){$('main').innerHTML='<h1>Profile</h1><div class="card form"><input value="'+esc(state.user.full_name)+'" readonly><input value="'+esc(state.user.email)+'" readonly><input value="'+esc(state.user.country||'')+'" readonly><p class="muted">Withdrawal address and PIN can be configured in Wallet Settings.</p></div>'}async function notifications(){try{const d=await api('/notifications');$('main').innerHTML='<h1>Notifications</h1>'+d.rows.map(n=>'<div class="card" style="margin:8px 0"><strong>'+esc(n.title)+'</strong><p class="muted">'+esc(n.body)+'</p></div>').join('')}catch(e){$('main').innerHTML='<div class="card">'+e.message+'</div>'}}function logout(){fetch('/api/logout',{method:'POST'}).finally(()=>location.reload())}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}start();</script></body></html>
