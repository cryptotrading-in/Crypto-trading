name: Apply app fixes
on:
  push:
    paths:
      - .github/workflows/app-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch application
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ---- Worker: persistent sessions + authoritative round prices ----
          p=Path('worker.js'); s=p.read_text()
          s=s.replace("const setCookie=(sid,max)=>`ct_session=${encodeURIComponent(sid)}; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=${max}`;", "const setCookie=(sid,max)=>`ct_session=${encodeURIComponent(sid)}; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=${max}; Priority=High`;")
          s=s.replace("new Date(Date.now()+604800000).toISOString()).run();await audit(e.DB,'client',uid,'signup'", "new Date(Date.now()+2592000000).toISOString()).run();await audit(e.DB,'client',uid,'signup'")
          s=s.replace("},{'Set-Cookie':setCookie(sid,604800)})}", "},{'Set-Cookie':setCookie(sid,2592000)})}")
          s=s.replace("new Date(Date.now()+604800000).toISOString()).run();await audit(e.DB,'client',u.id,'login'", "new Date(Date.now()+2592000000).toISOString()).run();await audit(e.DB,'client',u.id,'login'")
          s=s.replace("},{'Set-Cookie':setCookie(sid,604800)})}\nasync function adminLogin", "},{'Set-Cookie':setCookie(sid,2592000)})}\nasync function adminLogin")
          s=s.replace("new Date(Date.now()+28800000).toISOString()).run();await audit(e.DB,'admin'", "new Date(Date.now()+2592000000).toISOString()).run();await audit(e.DB,'admin'")
          s=s.replace("},{'Set-Cookie':setCookie(sid,28800)})}\nasync function logout", "},{'Set-Cookie':setCookie(sid,2592000)})}\nasync function logout")

          old="""const start=(b.startDate&&b.startTime)?new Date(`${b.startDate}T${b.startTime}:00Z`).toISOString():cur.start_at;const dur=Math.max(1,Math.min(86400,Number(b.durationSeconds||300)));const profit=Math.max(0,Math.min(100000,Math.round(Number(b.profitBps||0))));const fee=Math.max(0,Math.min(10000,Math.round(Number(b.feeBps||0))));await e.DB.prepare('UPDATE trading_rounds SET enabled=?,asset=?,action=?,start_at=?,duration_seconds=?,profit_bps=?,fee_bps=?,rules=?,status=? WHERE id=?').bind(b.enabled?1:0,String(b.asset||cur.asset),b.action,start,dur,profit,fee,String(b.rules||''),'upcoming',cur.id).run();"""
          new="""const start=(b.startDate&&b.startTime)?new Date(`${b.startDate}T${b.startTime}:00Z`).toISOString():cur.start_at;const dur=Math.max(1,Math.min(86400,Number(b.durationSeconds||300)));const profit=Math.max(0,Math.min(100000,Math.round(Number(b.profitBps||0))));const fee=Math.max(0,Math.min(10000,Math.round(Number(b.feeBps||0))));const entry=Math.round(Number(b.entryPriceMicros||0));const exit=Math.round(Number(b.exitPriceMicros||0));if(entry<=0||exit<=0)return fail('Entry Price and Exit Price are required.');await e.DB.prepare('UPDATE trading_rounds SET enabled=?,asset=?,action=?,start_at=?,duration_seconds=?,entry_price_micros=?,exit_price_micros=?,profit_bps=?,fee_bps=?,rules=?,status=? WHERE id=?').bind(b.enabled?1:0,String(b.asset||cur.asset),b.action,start,dur,entry,exit,profit,fee,String(b.rules||''),'upcoming',cur.id).run();"""
          if old not in s: raise SystemExit('saveRound target not found')
          s=s.replace(old,new)

          old="""const entry=Number(b.entryPriceMicros||0);if(entry<=0)return fail('Entry price is required.');const fee=Math.floor(a*Number(round.fee_bps)/10000);"""
          new="""const entry=Number(round.entry_price_micros||0);if(entry<=0)return fail('Entry price is not configured by Admin.');const fee=Math.floor(a*Number(round.fee_bps)/10000);"""
          if old not in s: raise SystemExit('enterTrade target not found')
          s=s.replace(old,new)

          old="""async function settleTrade(r,e){const s=await client(r,e),b=await body(r),t=await e.DB.prepare('SELECT t.*,r.profit_bps,r.round_no,r.duration_seconds FROM trades t JOIN trading_rounds r ON r.id=t.round_id WHERE t.id=? AND t.user_id=?').bind(b.tradeId,s.user_id).first();if(!t||t.result!=='open')return fail('Trade not found or already settled.',404);if(Date.now()-new Date(t.started_at).getTime()<Number(t.duration_seconds)*1000)return fail('Trade duration has not completed yet.',409);const win=b.result!=='loss',pnl=win?"""
          new="""async function settleTrade(r,e){const s=await client(r,e),b=await body(r),t=await e.DB.prepare('SELECT t.*,r.profit_bps,r.round_no,r.duration_seconds,r.action,r.exit_price_micros FROM trades t JOIN trading_rounds r ON r.id=t.round_id WHERE t.id=? AND t.user_id=?').bind(b.tradeId,s.user_id).first();if(!t||t.result!=='open')return fail('Trade not found or already settled.',404);if(Date.now()-new Date(t.started_at).getTime()<Number(t.duration_seconds)*1000)return fail('Trade duration has not completed yet.',409);const exit=Number(t.exit_price_micros||0);if(exit<=0)return fail('Exit price is not configured by Admin.');const win=t.action==='BUY'?exit>Number(t.entry_price_micros):exit<Number(t.entry_price_micros),pnl=win?"""
          if old not in s: raise SystemExit('settleTrade target not found')
          s=s.replace(old,new)
          s=s.replace(".bind(Number(b.exitPriceMicros||t.entry_price_micros),pnl,net,win?'win':'loss'", ".bind(exit,pnl,net,win?'win':'loss'")
          p.write_text(s)

          # ---- Admin: four independent settings menu entries ----
          p=Path('admin.html'); s=p.read_text()
          s=s.replace('<button onclick="page(\'settings\',this)">Deposit / Withdrawal / Bonus / WhatsApp</button>', '<button onclick="settingsSection(\'deposit\',this)">Deposit Settings</button><button onclick="settingsSection(\'withdrawal\',this)">Withdrawal Settings</button><button onclick="settingsSection(\'bonus\',this)">Bonus Settings</button><button onclick="settingsSection(\'whatsapp\',this)">WhatsApp Settings</button>')
          s=s.replace('<span class="muted" id="status">Checking…</span>', '<span class="muted" id="status"></span>')
          # Make round save send the actual price columns; no hidden metadata in Rules.
          s=s.replace("const userRules=$('rules'+i).value.trim();const rules='ENTRY_PRICE='+entry+'|EXIT_PRICE='+exit+'|'+userRules;await api('/admin/rounds/save',{method:'POST',body:JSON.stringify({roundNo:no,enabled:$('on'+i).value==='1',asset:$('asset'+i).value,action:$('act'+i).value,startDate:$('date'+i).value,startTime:$('time'+i).value,durationSeconds:Number($('dur'+i).value),profitBps:Math.round(Number($('profit'+i).value)*100),feeBps:Math.round(Number($('fee'+i).value)*100),rules})", "const rules=$('rules'+i).value.trim();await api('/admin/rounds/save',{method:'POST',body:JSON.stringify({roundNo:no,enabled:$('on'+i).value==='1',asset:$('asset'+i).value,action:$('act'+i).value,startDate:$('date'+i).value,startTime:$('time'+i).value,durationSeconds:Number($('dur'+i).value),entryPriceMicros:Math.round(entry*1000000),exitPriceMicros:Math.round(exit*1000000),profitBps:Math.round(Number($('profit'+i).value)*100),feeBps:Math.round(Number($('fee'+i).value)*100),rules})")
          s=s.replace("function settings(){", "async function settings(){")
          # Replace the old combined settings function with independent compact pages.
          m=re.search(r"async function settings\(\)\{.*?\nfunction logout\(\)",s,re.S)
          if not m: raise SystemExit('settings block not found')
          new_settings="""async function settings(){return settingsSection('deposit')}\nasync function settingsSection(section,el){try{closeMenu();document.querySelectorAll('#menu button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');const d=await api('/admin/settings');const s=d.settings||{};let title='',html='';if(section==='deposit'){title='Deposit Settings';html='<label>Preferred Network<select id=\\\"pref\\\"><option '+(s.preferred_network==='TRC20'?'selected':'')+'>TRC20</option><option '+(s.preferred_network==='ERC20'?'selected':'')+'>ERC20</option></select></label><label>TRC20 Deposit Address<input id=\\\"trc\\\" value=\\\"'+esc(s.trc20_deposit_address||'')+'\\\"></label><label>ERC20 Deposit Address<input id=\\\"erc\\\" value=\\\"'+esc(s.erc20_deposit_address||'')+'\\\"></label><label>Minimum Deposit USDT<input id=\\\"mind\\\" type=\\\"number\\\" min=\\\"0\\\" value=\\\"'+fmt(s.minimum_deposit_minor||3000)+'\\\"></label><button class=\\\"btn primary\\\" onclick=\\\"saveSettingsSection('deposit')\\\">SAVE DEPOSIT SETTINGS</button>'}else if(section==='withdrawal'){title='Withdrawal Settings';html='<label>Minimum Withdrawal USDT<input id=\\\"minw\\\" type=\\\"number\\\" min=\\\"0\\\" value=\\\"'+fmt(s.minimum_withdrawal_minor||1000)+'\\\"></label><button class=\\\"btn primary\\\" onclick=\\\"saveSettingsSection('withdrawal')\\\">SAVE WITHDRAWAL SETTINGS</button>'}else if(section==='bonus'){title='Bonus Settings';html='<label>Deposit Bonus Minimum USDT<input id=\\\"bm\\\" type=\\\"number\\\" min=\\\"0\\\" value=\\\"'+fmt(s.deposit_bonus_min_minor||0)+'\\\"></label><label>Deposit Bonus %<input id=\\\"bp\\\" type=\\\"number\\\" min=\\\"0\\\" step=\\\"0.01\\\" value=\\\"'+(Number(s.deposit_bonus_bps||0)/100)+'\\\"></label><label>Referral Reward USDT<input id=\\\"rr\\\" type=\\\"number\\\" min=\\\"0\\\" step=\\\"0.01\\\" value=\\\"'+fmt(s.referral_reward_minor||0)+'\\\"></label><button class=\\\"btn primary\\\" onclick=\\\"saveSettingsSection('bonus')\\\">SAVE BONUS SETTINGS</button>'}else{title='WhatsApp Settings';html='<label>WhatsApp Support 1<input id=\\\"wa1\\\" value=\\\"'+esc(s.whatsapp_1||'')+'\\\"></label><label>WhatsApp Support 2<input id=\\\"wa2\\\" value=\\\"'+esc(s.whatsapp_2||'')+'\\\"></label><label>WhatsApp Support 3<input id=\\\"wa3\\\" value=\\\"'+esc(s.whatsapp_3||'')+'\\\"></label><button class=\\\"btn primary\\\" onclick=\\\"saveSettingsSection('whatsapp')\\\">SAVE WHATSAPP SETTINGS</button>'} $('main').innerHTML='<h1>'+title+'</h1><div class=\\\"card\\\"><div class=\\\"form\\\">'+html+'<p id=\\\"smsg\\\" class=\\\"muted\\\"></p></div></div>'}catch(e){$('main').innerHTML='<div class=\\\"notice\\\">'+e.message+'</div>'}}\nasync function saveSettingsSection(section){try{const d=await api('/admin/settings');const s=d.settings||{};const b={preferredNetwork:s.preferred_network||'TRC20',trc20DepositAddress:s.trc20_deposit_address||'',erc20DepositAddress:s.erc20_deposit_address||'',minimumDeposit:Number(s.minimum_deposit_minor||3000)/100,minimumWithdrawal:Number(s.minimum_withdrawal_minor||1000)/100,depositBonusMin:Number(s.deposit_bonus_min_minor||0)/100,depositBonusPct:Number(s.deposit_bonus_bps||0)/100,referralReward:Number(s.referral_reward_minor||0)/100,whatsapp1:s.whatsapp_1||'',whatsapp2:s.whatsapp_2||'',whatsapp3:s.whatsapp_3||''};if(section==='deposit'){b.preferredNetwork=$('pref').value;b.trc20DepositAddress=$('trc').value;b.erc20DepositAddress=$('erc').value;b.minimumDeposit=$('mind').value}else if(section==='withdrawal'){b.minimumWithdrawal=$('minw').value}else if(section==='bonus'){b.depositBonusMin=$('bm').value;b.depositBonusPct=$('bp').value;b.referralReward=$('rr').value}else{b.whatsapp1=$('wa1').value;b.whatsapp2=$('wa2').value;b.whatsapp3=$('wa3').value}await api('/admin/settings/save',{method:'POST',body:JSON.stringify(b)});$('smsg').textContent='Settings saved.'}catch(e){$('smsg').textContent=e.message}}\nfunction logout()"""
          s=s[:m.start()]+new_settings+s[m.end():]
          # Silent auth boot: no visible session-check screen.
          s=s.replace("async function boot(){try{const d=await api('/admin/me');$('status').textContent='Signed in: '+(d.admin?.username||d.admin?.email||'Admin');dashboard()}catch{login()}}", "async function boot(){try{const d=await api('/admin/me');$('status').textContent='';dashboard()}catch{login()}}")
          p.write_text(s)

          # ---- Client: no visible session-check; dedicated trade screen with automatic settlement ----
          p=Path('client.html'); s=p.read_text()
          s=s.replace('.receiptPreview{display:block;max-width:100%;max-height:260px;margin:10px auto;border-radius:10px;border:1px solid var(--line)}', '.receiptPreview{display:block;max-width:100%;max-height:260px;margin:10px auto;border-radius:10px;border:1px solid var(--line)}.tradeOverlay{position:fixed;inset:0;z-index:100;background:#070b12;overflow:auto;padding:20px}.tradePanel{max-width:620px;margin:30px auto}.countdown{font-size:42px;font-weight:800;text-align:center;margin:18px 0}.resultWin{border:1px solid #14532d}.resultLoss{border:1px solid #7f1d1d}')
          s=s.replace('<div id="sessionLoading" class="card" style="max-width:430px;margin:60px auto;text-align:center">Checking secure session…</div>', '')
          s=s.replace("function showAuth(message=''){ $('sessionLoading').classList.add('hidden');$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('msg').textContent=message }\n", '')
          s=s.replace("async function start(){for(let attempt=0;attempt<2;attempt++){try{state=await api('/me');$('sessionLoading').classList.add('hidden');$('auth').classList.add('hidden');$('app').classList.remove('hidden');await renderHome();return}catch(e){if(attempt===0)await new Promise(r=>setTimeout(r,300))}}showAuth('Please sign in to continue.')}", "async function start(){try{state=await api('/me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');await renderHome()}catch(e){$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('msg').textContent='Please sign in to continue.'}}")
          # Round cards: open the dedicated screen, not a box at the bottom.
          s=s.replace("function roundButton(r){return r.unlocked?'<button class=\"btn primary\" onclick=\"openTradeById('\\''+esc(r.id)+'\\'')\">Open Round</button>':'<button class=\"btn\" onclick=\"page(\\'deposit\\')\">Deposit to Unlock</button>'}", "function roundButton(r){return r.unlocked?'<button class=\"btn primary\" onclick=\"openTradeById('\\''+esc(r.id)+'\\'')\">Open Round</button>':'<button class=\"btn\" onclick=\"page(\\'deposit\\')\">Deposit to Unlock</button>'}")
          # Replace trading/open/enter/settle block.
          m=re.search(r"async function trading\(\).*?async function profile\(\)",s,re.S)
          if not m: raise SystemExit('client trading block not found')
          block="""async function trading(){const s=await refresh();$('main').innerHTML='<h1>Trading</h1><p class=\\\"muted\\\">Exactly five platform-defined rounds per 24-hour cycle. Select any eligible round to open its trade screen.</p><div class=\\\"rounds\\\">'+s.rounds.map(r=>'<div class=\\\"card\\\"><span class=\\\"badge '+(r.unlocked?'green':'amber')+'\\\">'+(r.unlocked?'ELIGIBLE':'LOCKED')+'</span><h3>Round '+esc(r.round_no)+'</h3><p>'+esc(r.asset)+' · '+esc(r.action==='BUY'?'UP':'DOWN')+'</p><p>Entry Price: <b>'+price(r.entry_price_micros)+'</b></p><p>Exit Price: <b>'+price(r.exit_price_micros)+'</b></p><p>Duration: '+esc(r.duration_seconds)+' sec</p><p>Profit: '+esc(r.profit_pct)+'% · Fee: '+esc(r.fee_pct)+'%</p>'+roundButton(r)+'</div>').join('')+'</div>'}\nfunction openTradeById(roundId){const r=(state?.rounds||[]).find(x=>x.id===roundId);if(!r||!r.unlocked)return;const old=document.getElementById('tradeScreen');if(old)old.remove();const el=document.createElement('div');el.id='tradeScreen';el.className='tradeOverlay';el.innerHTML='<div class=\\\"tradePanel\\\"><div class=\\\"section\\\"><h1>Round '+esc(r.round_no)+'</h1><button class=\\\"btn\\\" onclick=\\\"closeTradeScreen()\\\">Close</button></div><div class=\\\"card\\\"><p><b>'+esc(r.asset)+'</b> · Direction <b>'+esc(r.action==='BUY'?'UP':'DOWN')+'</b></p><p>Entry Price: <b>'+price(r.entry_price_micros)+'</b></p><p>Exit Price: <b>'+price(r.exit_price_micros)+'</b></p><p>Duration: <b>'+esc(r.duration_seconds)+' seconds</b></p><div id=\\\"tradeForm\\\"><label>Amount USDT<input id=\\\"tamt\\\" type=\\\"number\\\" min=\\\"0.01\\\" step=\\\"0.01\\\" placeholder=\\\"Enter amount\\\"></label><button class=\\\"btn primary\\\" style=\\\"margin-top:12px;width:100%\\\" onclick=\\\"enterTrade('\\''+esc(r.id)+'\\'')\\\">START TRADE</button><p id=\\\"tmsg\\\" class=\\\"muted\\\"></p></div></div></div>';document.body.appendChild(el)}\nfunction closeTradeScreen(){const el=document.getElementById('tradeScreen');if(el)el.remove()}\nasync function enterTrade(roundId){try{const r=(state?.rounds||[]).find(x=>x.id===roundId);if(!r||!(Number(r.entry_price_micros)>0)||!(Number(r.exit_price_micros)>0))throw Error('Admin has not configured Entry and Exit Prices for this round.');const d=await api('/trade/enter',{method:'POST',body:JSON.stringify({roundId,amount:$('tamt').value})});const form=$('tradeForm');form.innerHTML='<p class=\\\"green\\\"><b>Trade started.</b></p><p class=\\\"muted\\\">Your trade is active. It will close automatically when the round duration ends.</p><div id=\\\"tradeCountdown\\\" class=\\\"countdown\\\">'+esc(r.duration_seconds)+'</div><p id=\\\"tradeStatus\\\" class=\\\"muted\\\"></p>';let left=Number(r.duration_seconds);const tick=async()=>{left--;const c=$('tradeCountdown');if(c)c.textContent=Math.max(0,left);if(left<=0){clearInterval(window.__tradeTimer);await autoSettleTrade(d.tradeId)}else{const st=$('tradeStatus');if(st)st.textContent='Time remaining: '+left+' seconds'}};window.__tradeTimer=setInterval(tick,1000)}catch(e){$('tmsg').textContent=e.message}}\nasync function autoSettleTrade(tradeId){try{const d=await api('/trade/settle',{method:'POST',body:JSON.stringify({tradeId})});const panel=document.querySelector('#tradeScreen .card');if(panel)panel.innerHTML='<div class=\\\"'+(d.result==='win'?'resultWin':'resultLoss')+' card\\\"><h2>Trade Result: '+esc(String(d.result||'').toUpperCase())+'</h2><p>Net P/L: <b>'+esc(d.netPnl)+' USDT</b></p><button class=\\\"btn primary\\\" onclick=\\\"closeTradeScreen();trading()\\\">DONE</button></div>';await refresh()}catch(e){const st=$('tradeStatus');if(st)st.textContent=e.message}}\nasync function profile()"""
          s=s[:m.start()]+block+s[m.end():]
          p.write_text(s)
          PY
          node --check worker.js
          node --check /tmp/none.js 2>/dev/null || true
          git status --short
      - name: Commit fixes and remove maintenance workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js admin.html client.html
          git commit -m "Fix auth persistence, settings separation and round trading" || true
          git rm .github/workflows/app-fix.yml
          git commit -m "Remove one-time maintenance workflow" || true
          git push
