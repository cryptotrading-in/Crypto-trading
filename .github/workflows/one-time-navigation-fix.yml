name: One-time navigation bootstrap fix
on:
  push:
    paths:
      - '.github/workflows/one-time-navigation-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add navigation bootstrap to app HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('client.html', 'admin.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              marker = '<script src="/navigation.js"></script>'
              if marker not in s:
                  if '</body>' not in s:
                      raise SystemExit(f'No </body> in {name}')
                  s = s.replace('</body>', marker + '</body>', 1)
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched app HTML and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-navigation-fix.yml
          git add client.html admin.html
          git commit -m 'Fix app navigation bootstrap on first load'
          git push
