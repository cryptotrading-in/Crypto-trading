name: Admin PWA bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add admin manifest and refresh service-worker shell
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          marker='<link rel="stylesheet" href="/glassmorphism.css">'
          link='<link rel="manifest" href="/admin-manifest.json"><meta name="theme-color" content="#070b12">'
          if '/admin-manifest.json' not in s:
              if marker not in s:
                  raise SystemExit('admin.html manifest insertion point not found')
              s=s.replace(marker, marker+link, 1)
              p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace('cryptotrade-shell-v11','cryptotrade-shell-v12',1)
          s=s.replace('"/manifest.json","/icon.svg"','"/manifest.json","/admin-manifest.json","/icon.svg"',1)
          p.write_text(s)
          PY
      - name: Commit and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/admin-pwa-bootstrap.yml
          git add admin.html admin-manifest.json sw.js .github/workflows/admin-pwa-bootstrap.yml
          git diff --cached --quiet && exit 0
          git commit -m "Enable admin PWA installation"
          git push
