name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check worker.js
      - name: Check HTML scripts
        run: |
          set -e
          for f in index.html signup.html client.html admin.html; do
            python3 -c 'import re,sys; s=open(sys.argv[1],encoding="utf-8").read(); b=re.findall(r"<script[^>]*>(.*?)</script>",s,re.I|re.S); assert b, sys.argv[1]+": no script block"; [open(f"/tmp/{sys.argv[1].replace(chr(46),chr(95))}.{i}.js","w",encoding="utf-8").write(x) for i,x in enumerate(b)]' "$f"
          done
          for f in /tmp/*.html.*.js; do node --check "$f"; done
          echo 'All HTML script blocks passed syntax checks.'
