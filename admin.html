<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoTrade Admin</title><link rel="stylesheet" href="/glassmorphism.css"><link rel="manifest" href="/admin-manifest.json"><meta name="theme-color" content="#070b12"><style>:root{--bg:#070b12;--panel:#0d131d;--line:#1d2938;--text:#f5f7fb;--muted:#8d9aac;--blue:#38bdf8;--green:#22c55e;--red:#ef4444;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}button,input,select,textarea{font:inherit}.bar{height:64px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:0 16px;background:#080d15ee;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.btn{border:1px solid var(--line);background:#111a26;color:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.btn:hover{filter:brightness(1.15)}.primary{background:#0ea5e9;border-color:#0ea5e9}.danger{background:#361218;border-color:#63202b}.menu{position:fixed;z-index:15;top:64px;left:0;bottom:0;width:260px;padding:14px;background:#090f17;border-right:1px solid var(--line);transform:translateX(-105%);transition:.28s}.menu.open{transform:none}.menu button{width:100%;display:block;text-align:left;background:none;border:0;color:var(--muted);padding:12px;border-radius:9px;cursor:pointer}.menu button:hover,.menu button.active{background:#14202e;color:#fff}.main{max-width:1250px;margin:auto;padding:22px 16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px}.num{font-size:27px;font-weight:800;margin-top:5px}.muted{color:var(--muted)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#172334;font-size:11px}.form{display:grid;gap:10px;max-width:720px}.form input,.form select,.form textarea{width:100%;padding:11px;background:#09111b;border:1px solid var(--line);border-radius:9px;color:#fff}.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.notice{padding:11px;border:1px solid #5b4310;background:#241b08;color:#fbbf24;border-radius:9px}.actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}h1{font-size:24px}h2{font-size:19px}.roundCard{min-width:0}.fieldLabel{display:grid;gap:5px;font-weight:650}.fieldLabel small{color:var(--muted);font-weight:400}.priceRow{display:grid;grid-template-columns:1fr 1fr;gap:9px}.receiptThumb{width:70px;height:55px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}@media(max-width:950px){.grid{grid-template-columns:1fr 1fr}.rounds{grid-template-columns:1fr 1fr}}@media(max-width:650px){.rounds{grid-template-columns:1fr}.priceRow{grid-template-columns:1fr}}@media(max-width:550px){.main{padding:16px 11px}.grid{grid-template-columns:1fr}.menu{width:240px}.bar strong{font-size:13px}}.dashCard{width:100%;text-align:left;color:var(--text);cursor:pointer;transition:transform .15s,filter .15s}.dashCard:hover{transform:translateY(-2px);filter:brightness(1.12)}</style></head><body><div class="bar"><button class="btn" onclick="toggleMenu()">☰</button><strong>CryptoTrade Admin</strong><span class="muted" id="status"></span><button class="btn" style="margin-left:auto" onclick="logout()">Logout</button></div><aside id="menu" class="menu"><button onclick="page('dashboard',this)">Dashboard</button><button onclick="page('users',this)">Users / Clients</button><button onclick="page('wallet',this)">Wallet Management</button><button onclick="page('deposits',this)">Deposits</button><button onclick="page('withdrawals',this)">Withdrawals</button><button onclick="settingsSection('deposit',this)">Deposit Settings</button><button onclick="settingsSection('withdrawal',this)">Withdrawal Settings</button><button onclick="settingsSection('bonus',this)">Bonus Settings</button><button onclick="settingsSection('whatsapp',this)">WhatsApp Settings</button><button onclick="page('rounds',this)">Trading · Round 1–5</button><button onclick="page('trades',this)">Trading History</button><button onclick="page('referrals',this)">Referrals</button></aside><main id="main" class="main"></main><script>
const $=x=>document.getElementById(x);const api=async(path,opt={},attempt=0)=>{let r;try{r=await fetch('/api'+path,{...opt,credentials:'include',headers:{'content-type':'application/json',...(opt.headers||{})}})}catch(e){if(attempt<2){await new Promise(x=>setTimeout(x,350*(attempt+1)));return api(path,opt,attempt+1)}throw e}let d={};try{d=await r.json()}catch{}if(!r.ok||d.ok===false){if(attempt<2&&r.status>=500){await new Promise(x=>setTimeout(x,350*(attempt+1)));return api(path,opt,attempt+1)}const e=Error(d.error||'Request failed');e.status=r.status;throw e}return d};const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=x=>(Number(x||0)/100).toFixed(2);const toPkt=x=>{const t=new Date(x||Date.now());return new Date(t.getTime()+(5*60+t.getTimezoneOffset())*60000)};const date=x=>{if(!x)return'—';const d=toPkt(x);return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear()};const dtParts=x=>{const d=toPkt(x);return{date:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}};const price=x=>Number(x||0)/1000000;const cleanRules=x=>String(x||'').replace(/^ENTRY_PRICE=[^|]*\|EXIT_PRICE=[^|]*\|/,'');
function toggleMenu(){$('menu').classList.toggle('open')}function closeMenu(){$('menu').classList.remove('open')}function page(p,el){closeMenu();document.querySelectorAll('#menu button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');({dashboard,users,wallet,deposits,withdrawals,rounds,trades,settings}[p]||dashboard)()}
async function boot(){try{await api('/admin/me');$('status').textContent='';dashboard()}catch(e){if(e.status===401)login();else{login();$('status').textContent='Connection issue — retrying…';setTimeout(()=>boot(),1200)}}}function login(){$('main').innerHTML='<div class="card" style="max-width:440px;margin:60px auto"><h1>Admin Sign In</h1><div class="form"><input id="identifier" placeholder="Username or primary admin email"><input id="password" type="password" placeholder="Password"><button class="btn primary" onclick="doLogin()">Sign In</button><button class="btn" onclick="bootstrap()">First-time Primary Admin Setup</button><p id="msg" class="muted"></p></div></div>'}async function doLogin(){try{await api('/admin/login',{method:'POST',body:JSON.stringify({identifier:$('identifier').value,password:$('password').value})});location.reload()}catch(e){$('msg').textContent=e.message}}async function bootstrap(){const email=prompt('Primary admin email:');if(!email)return;const password=prompt('Primary admin password (8+ chars):');if(!password)return;const pin=prompt('4-digit recovery PIN:');if(!pin)return;try{await api('/admin/bootstrap',{method:'POST',body:JSON.stringify({email,password,recoveryPin:pin})});alert('Primary admin created. Sign in now.')}catch(e){alert(e.message)}}
async function dashboard(){try{const d=await api('/admin/summary');$('main').innerHTML='<h1>Dashboard</h1><div class="grid"><button class="card dashCard" onclick="users()">Clients<div class="num">'+d.summary.clients+'</div><small class="muted">View client data →</small></button><button class="card dashCard" onclick="deposits()">Pending deposits<div class="num">'+d.summary.pendingDeposits+'</div><small class="muted">View deposit requests →</small></button><button class="card dashCard" onclick="withdrawals()">Pending withdrawals<div class="num">'+d.summary.pendingWithdrawals+'</div><small class="muted">View withdrawal requests →</small></button><button class="card dashCard" onclick="trades()">Trades<div class="num">'+d.summary.trades+'</div><small class="muted">View trade data →</small></button></div><div class="grid" style="margin-top:13px"><div class="card">Total available wallet<div class="num">'+d.summary.walletAvailable+' USDT</div></div></div>'}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}
async function users(){try{const d=await api('/admin/users');$('main').innerHTML='<div class="section"><h1>Users / Clients</h1><button class="btn" onclick="users()">Refresh</button></div><div class="tablewrap"><table class="table"><tr><th>Client / ID</th><th>Email</th><th>Balance</th><th>Reserved</th><th>Withdrawal Address</th><th>Status</th><th>Registered</th></tr>'+d.rows.map(x=>'<tr><td><b>'+esc(x.full_name)+'</b><br><small>'+esc(x.id)+'</small><br><button class="btn" onclick="navigator.clipboard.writeText('+JSON.stringify(x.id)+')">Copy ID</button></td><td>'+esc(x.email)+'</td><td>'+fmt(x.available_minor)+' USDT</td><td>'+fmt(x.reserved_minor)+' USDT</td><td>'+esc(x.withdrawal_address||'—')+(x.withdrawal_address?' <button class="btn" onclick="navigator.clipboard.writeText('+JSON.stringify(x.withdrawal_address)+')">Copy</button>':'')+'</td><td><span class="pill">'+esc(x.account_status)+'</span></td><td>'+date(x.created_at)+'</td></tr>').join('')+'</table></div>'}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}
function wallet(){$('main').innerHTML='<h1>Wallet Management</h1><div class="card"><p class="muted">Adjustments are recorded as ledger transactions.</p><div class="form"><input id="wid" placeholder="Client ID"><input id="wamount" type="number" step="0.01" min="0.01" placeholder="Amount USDT"><select id="wtype"><option value="credit">Add Balance</option><option value="debit">Deduct Balance</option></select><input id="wreason" placeholder="Reason"><button class="btn primary" onclick="adjustWallet()">Confirm Adjustment</button><p id="wmsg" class="muted"></p></div></div>'}async function adjustWallet(){try{const d=await api('/admin/wallet/adjust',{method:'POST',body:JSON.stringify({userId:$('wid').value.trim(),amount:$('wamount').value,type:$('wtype').value,reason:$('wreason').value})});$('wmsg').textContent='Completed. New balance: '+d.balance+' USDT'}catch(e){$('wmsg').textContent=e.message}}
async function deposits(){try{const d=await api('/admin/deposits');$('main').innerHTML='<div class="section"><h1>Deposits</h1><button class="btn" onclick="deposits()">Refresh</button></div><div class="tablewrap"><table class="table"><tr><th>Client</th><th>Amount</th><th>Network</th><th>Deposit Address</th><th>TXID</th><th>Receipt</th><th>Date</th><th>Status</th><th>Action</th></tr>'+d.rows.map(x=>'<tr><td>'+esc(x.full_name)+'<br><small>'+esc(x.email)+'</small></td><td>'+fmt(x.amount_minor)+' USDT</td><td>'+esc(x.network)+'</td><td><span title="'+esc(x.deposit_address||'')+'">'+esc((x.deposit_address||'').slice(0,18))+(x.deposit_address?'…':'—')+'</span><br>'+(x.deposit_address?'<button class="btn" onclick="navigator.clipboard.writeText('+JSON.stringify(x.deposit_address)+')">Copy</button>':'')+'</td><td><span title="'+esc(x.txid)+'">'+esc((x.txid||'').slice(0,20))+'</span></td><td>'+(x.receipt_key?'<a href="'+x.receipt_key+'" target="_blank" rel="noopener"><img class="receiptThumb" src="'+x.receipt_key+'" alt="Receipt"></a>':'—')+'</td><td>'+date(x.submitted_at)+'</td><td><span class="pill">'+esc(x.status)+'</span></td><td>'+(x.status==='submitted'||x.status==='reviewing'?'<div class="actions"><button class="btn primary" onclick="reviewDeposit(\''+x.id+'\',\'approved\')">Approve</button><button class="btn danger" onclick="reviewDeposit(\''+x.id+'\',\'rejected\')">Reject</button></div>':'—')+'</td></tr>').join('')+'</table></div>'}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}async function reviewDeposit(id,status){try{await api('/admin/deposit/review',{method:'POST',body:JSON.stringify({id,status,note:status==='rejected'?prompt('Rejection note:')||'Rejected by admin':''})});deposits()}catch(e){alert(e.message)}}
async function withdrawals(){try{const d=await api('/admin/withdrawals');$('main').innerHTML='<div class="section"><h1>Withdrawals</h1><button class="btn" onclick="withdrawals()">Refresh</button></div><div class="tablewrap"><table class="table"><tr><th>Client</th><th>Amount</th><th>TRC20 Address</th><th>Date</th><th>Status</th><th>Update</th></tr>'+d.rows.map(x=>'<tr><td>'+esc(x.full_name)+'<br><small>'+esc(x.email)+'</small></td><td>'+fmt(x.amount_minor)+' USDT</td><td>'+esc(x.address)+' <button class="btn" onclick="navigator.clipboard.writeText('+JSON.stringify(x.address||'')+')">Copy</button></td><td>'+date(x.requested_at)+'</td><td><span class="pill">'+esc(x.status)+'</span></td><td><select onchange="withdrawStatus(\''+x.id+'\',this.value)"><option value="">Select status</option><option value="approved">approved</option><option value="processing">processing</option><option value="completed">completed</option><option value="rejected">rejected</option></select></td></tr>').join('')+'</table></div>'}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}async function withdrawStatus(id,status){if(!status)return;try{await api('/admin/withdrawal/status',{method:'POST',body:JSON.stringify({id,status})});withdrawals()}catch(e){alert(e.message)}}
function roundCard(r,i){const p=dtParts(r.start_at),entry=price(r.entry_price_micros),exit=price(r.exit_price_micros);return '<div class="card roundCard"><h2>ROUND '+r.round_no+'</h2><div class="form"><label class="fieldLabel">Status<select id="on'+i+'"><option value="1" '+(r.enabled?'selected':'')+'>ON</option><option value="0" '+(!r.enabled?'selected':'')+'>OFF</option></select></label><label class="fieldLabel">Asset<select id="asset'+i+'"><option '+(r.asset==='BTC/USDT'?'selected':'')+'>BTC/USDT</option><option '+(r.asset==='ETH/USDT'?'selected':'')+'>ETH/USDT</option><option '+(r.asset==='SOL/USDT'?'selected':'')+'>SOL/USDT</option><option '+(r.asset==='ZEC/USDT'?'selected':'')+'>ZEC/USDT</option></select></label><label class="fieldLabel">Direction<select id="act'+i+'"><option value="BUY" '+(r.action==='BUY'?'selected':'')+'>UP</option><option value="SELL" '+(r.action==='SELL'?'selected':'')+'>DOWN</option></select></label><label class="fieldLabel">Date<input id="date'+i+'" type="date" value="'+p.date+'"><small>Display: DD-MM-YYYY</small></label><label class="fieldLabel">Start Time<input id="time'+i+'" type="time" value="'+p.time+'"></label><label class="fieldLabel">Duration<select id="dur'+i+'"><option value="60" '+(Number(r.duration_seconds)===60?'selected':'')+'>01 min</option><option value="300" '+(Number(r.duration_seconds)===300?'selected':'')+'>05 min</option><option value="600" '+(Number(r.duration_seconds)===600?'selected':'')+'>10 min</option><option value="900" '+(Number(r.duration_seconds)===900?'selected':'')+'>15 min</option><option value="1800" '+(Number(r.duration_seconds)===1800?'selected':'')+'>30 min</option><option value="3600" '+(Number(r.duration_seconds)===3600?'selected':'')+'>60 min</option></select></label><div class="priceRow"><label class="fieldLabel">Entry Price<input id="entry'+i+'" type="number" step="0.000001" min="0" value="'+(entry||'')+'" placeholder="Admin set entry price"></label><label class="fieldLabel">Exit Price<input id="exit'+i+'" type="number" step="0.000001" min="0" value="'+(exit||'')+'" placeholder="Admin set exit price"></label></div><label class="fieldLabel">Profit %<input id="profit'+i+'" type="number" step="0.01" min="0" value="'+(Number(r.profit_bps)/100)+'" placeholder="Profit %"></label><label class="fieldLabel">Fees<input id="fee'+i+'" type="number" step="0.01" min="0" value="'+(Number(r.fee_bps)/100)+'" placeholder="Fees %"></label><label class="fieldLabel">Rules<textarea id="rules'+i+'" rows="4" placeholder="Enter round rules">'+esc(cleanRules(r.rules))+'</textarea></label><button class="btn primary" onclick="saveRound('+r.round_no+','+i+')">SAVE ROUND</button></div></div>'}
async function rounds(){try{const d=await api('/admin/rounds');$('main').innerHTML='<div class="section"><h1>Round Manager · exactly 5 rounds</h1><button class="btn" onclick="rounds()">Refresh</button></div><p class="muted">Admin controls all five rounds. Entry and Exit prices are fixed by Admin and used for the trade. Date display: DD-MM-YYYY.</p><div class="rounds">'+d.rows.map(roundCard).join('')+'</div>'}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}
async function saveRound(no,i){try{const entry=Number($('entry'+i).value),exit=Number($('exit'+i).value);if(!(entry>0)||!(exit>0))throw Error('Entry Price and Exit Price are required.');const rules=$('rules'+i).value.trim();await api('/admin/rounds/save',{method:'POST',body:JSON.stringify({roundNo:no,enabled:$('on'+i).value==='1',asset:$('asset'+i).value,action:$('act'+i).value,startDate:$('date'+i).value,startTime:$('time'+i).value,durationSeconds:Number($('dur'+i).value),entryPriceMicros:Math.round(entry*1000000),exitPriceMicros:Math.round(exit*1000000),profitBps:Math.round(Number($('profit'+i).value)*100),feeBps:Math.round(Number($('fee'+i).value)*100),rules})});alert('Round '+no+' saved.');rounds()}catch(e){alert(e.message)}}
async function trades(){try{const d=await api('/admin/trades');$('main').innerHTML='<div class="section"><h1>Trading History</h1><button class="btn" onclick="trades()">Refresh</button></div><div class="tablewrap"><table class="table"><tr><th>Client</th><th>Round</th><th>Direction</th><th>Amount</th><th>Entry</th><th>Exit</th><th>Gross P/L</th><th>Fees</th><th>Net P/L</th><th>Result</th><th>Start</th><th>End</th></tr>'+d.rows.map(x=>'<tr><td>'+esc(x.full_name)+'</td><td>'+x.round_no+' · '+esc(x.asset)+'</td><td>'+esc(x.action==='BUY'?'UP':'DOWN')+'</td><td>'+fmt(x.amount_minor)+'</td><td>'+price(x.entry_price_micros)+'</td><td>'+price(x.exit_price_micros)+'</td><td>'+fmt(x.gross_pnl_minor)+'</td><td>'+fmt(x.fee_minor)+'</td><td>'+fmt(x.net_pnl_minor)+'</td><td><span class="pill">'+esc(x.result)+'</span></td><td>'+date(x.started_at)+'</td><td>'+date(x.ended_at)+'</td></tr>').join('')+'</table></div>'}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}
async function settings(){return settingsSection('deposit')}
async function settingsSection(section,el){try{closeMenu();document.querySelectorAll('#menu button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');const d=await api('/admin/settings');const s=d.settings||{};let title='',html='';if(section==='deposit'){title='Deposit Settings';html='<label>Preferred Network<select id="pref"><option '+(s.preferred_network==='TRC20'?'selected':'')+'>TRC20</option><option '+(s.preferred_network==='ERC20'?'selected':'')+'>ERC20</option></select></label><label>TRC20 Deposit Address<input id="trc" value="'+esc(s.trc20_deposit_address||'')+'"></label><label>ERC20 Deposit Address<input id="erc" value="'+esc(s.erc20_deposit_address||'')+'"></label><label>Minimum Deposit USDT<input id="mind" type="number" min="0" value="'+fmt(s.minimum_deposit_minor||3000)+'"></label><button class="btn primary" onclick="saveSettingsSection(\'deposit\')">SAVE DEPOSIT SETTINGS</button>'}else if(section==='withdrawal'){title='Withdrawal Settings';html='<label>Minimum Withdrawal USDT<input id="minw" type="number" min="0" value="'+fmt(s.minimum_withdrawal_minor||1000)+'"></label><button class="btn primary" onclick="saveSettingsSection(\'withdrawal\')">SAVE WITHDRAWAL SETTINGS</button>'}else if(section==='bonus'){title='Bonus Settings';html='<label>Deposit Bonus Minimum USDT<input id="bm" type="number" min="0" value="'+fmt(s.deposit_bonus_min_minor||0)+'"></label><label>Deposit Bonus %<input id="bp" type="number" min="0" step="0.01" value="'+(Number(s.deposit_bonus_bps||0)/100)+'"></label><label>Referral Reward USDT<input id="rr" type="number" min="0" step="0.01" value="'+fmt(s.referral_reward_minor||0)+'"></label><button class="btn primary" onclick="saveSettingsSection(\'bonus\')">SAVE BONUS SETTINGS</button>'}else{title='WhatsApp Settings';html='<label>WhatsApp Support 1<input id="wa1" value="'+esc(s.whatsapp_1||'')+'"></label><label>WhatsApp Support 2<input id="wa2" value="'+esc(s.whatsapp_2||'')+'"></label><label>WhatsApp Support 3<input id="wa3" value="'+esc(s.whatsapp_3||'')+'"></label><button class="btn primary" onclick="saveSettingsSection(\'whatsapp\')">SAVE WHATSAPP SETTINGS</button>'}$('main').innerHTML='<h1>'+title+'</h1><div class="card"><div class="form">'+html+'<p id="smsg" class="muted"></p></div></div>'}catch(e){$('main').innerHTML='<div class="notice">'+e.message+'</div>'}}
async function saveSettingsSection(section){try{const d=await api('/admin/settings');const s=d.settings||{};const b={preferredNetwork:s.preferred_network||'TRC20',trc20DepositAddress:s.trc20_deposit_address||'',erc20DepositAddress:s.erc20_deposit_address||'',minimumDeposit:Number(s.minimum_deposit_minor||3000)/100,minimumWithdrawal:Number(s.minimum_withdrawal_minor||1000)/100,depositBonusMin:Number(s.deposit_bonus_min_minor||0)/100,depositBonusPct:Number(s.deposit_bonus_bps||0)/100,referralReward:Number(s.referral_reward_minor||0)/100,whatsapp1:s.whatsapp_1||'',whatsapp2:s.whatsapp_2||'',whatsapp3:s.whatsapp_3||''};if(section==='deposit'){b.preferredNetwork=$('pref').value;b.trc20DepositAddress=$('trc').value;b.erc20DepositAddress=$('erc').value;b.minimumDeposit=$('mind').value}else if(section==='withdrawal'){b.minimumWithdrawal=$('minw').value}else if(section==='bonus'){b.depositBonusMin=$('bm').value;b.depositBonusPct=$('bp').value;b.referralReward=$('rr').value}else{b.whatsapp1=$('wa1').value;b.whatsapp2=$('wa2').value;b.whatsapp3=$('wa3').value}await api('/admin/settings/save',{method:'POST',body:JSON.stringify(b)});$('smsg').textContent='Settings saved.'}catch(e){$('smsg').textContent=e.message}}

HTML='<div class="notice">'+esc(e.message)+'</div>}}async function saveReferralSettings(){try{await api('/admin/referral-settings',{method:'POST',body:JSON.stringify({enabled:$('re').value==='1',reward:$('rr').value,minimumDeposit:$('rm').value,holdHours:$('rh').value})});$('rmsg').textContent='Saved.';referrals()}catch(e){$('rmsg').textContent=e.message}}
